name: Sync Instagram to TEUM Feed
on:
  workflow_dispatch:
  schedule:
    - cron: '*/30 * * * *'
permissions:
  contents: write
concurrency:
  group: instagram-feed-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Sync official Instagram posts
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: python scripts/sync_instagram.py
      - name: Commit changed feed
        run: |
          if ! git diff --quiet -- public/data/instagram-feed.json || [ -n "$(git ls-files --others --exclude-standard public/data/instagram-feed.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add public/data/instagram-feed.json
            git commit -m "chore: sync official Instagram feed"
            git push
          fi
