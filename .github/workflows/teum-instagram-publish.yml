name: TEUM Instagram Manual Publish
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type PUBLISH to post to Instagram'
        required: true
        type: string
jobs:
  publish:
    if: ${{ inputs.confirm == 'PUBLISH' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Publish approved carousel
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
          INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
          CONFIRM_PUBLISH: ${{ inputs.confirm }}
        run: python3 instagram_automation/publish.py
