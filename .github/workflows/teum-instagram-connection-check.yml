name: TEUM Instagram API Connection Check
on:
  workflow_dispatch:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - name: Verify Instagram Login token (no publishing)
        env:
          INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.parse, urllib.error
          token = os.environ.get("INSTAGRAM_ACCESS_TOKEN", "").strip()
          if not token:
              raise SystemExit("INSTAGRAM_ACCESS_TOKEN secret missing or empty")
          url = "https://graph.instagram.com/v23.0/me?" + urllib.parse.urlencode({"fields":"id,username,account_type","access_token":token})
          try:
              with urllib.request.urlopen(url, timeout=25) as resp:
                  data = json.load(resp)
              if not data.get("id"):
                  raise SystemExit("Instagram Login response missing account ID")
              print("Instagram Login API token accepted; account ID received (not printed).")
              print("Account type:", data.get("account_type", "not returned"))
          except urllib.error.HTTPError as e:
              try:
                  error = json.loads(e.read()).get("error", {})
                  print("Instagram Login error code:", error.get("code"), "subcode:", error.get("error_subcode"))
                  print("Error type:", error.get("type", "not returned"))
              except Exception:
                  print("Instagram Login HTTP error:", e.code)
              raise SystemExit(1)
          PY
