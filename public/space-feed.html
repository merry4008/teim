<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>공간비움 | 트임피드</title><style>
:root{--accent:#2367e8;--ink:#20252c;--muted:#79818b;--line:#e9edf2}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}a{text-decoration:none;color:inherit}button{font:inherit;cursor:pointer}.wrap{max-width:720px;margin:auto;padding:0 18px 110px}.top{height:65px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:900;letter-spacing:-1px}.brand span{color:#2367e8}.top a:last-child{font-size:13px;color:#66717d}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:900;margin-top:18px}h1{font-size:30px;letter-spacing:-1.5px;margin:9px 0}.intro{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 21px}.tabs{display:flex;gap:23px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}.tabs a{flex:0 0 auto;padding:15px 0;font-size:14px;color:#8c939c;font-weight:700}.tabs a.active{border-bottom:3px solid var(--accent);color:var(--ink)}.hero{margin:23px 0 25px;background:#edf4ff;padding:23px;border-radius:23px;min-height:170px;position:relative;overflow:hidden}.hero small{font-size:11px;font-weight:900;color:var(--accent)}.hero h2{font-size:23px;letter-spacing:-.9px;line-height:1.35;max-width:260px;margin:14px 0 8px}.hero p{font-size:12px;color:#697588;margin:0}.hero .art{position:absolute;right:20px;bottom:10px;font-size:78px;opacity:.75}.section{display:flex;align-items:center;justify-content:space-between;margin:23px 0 13px}.section h2{margin:0;font-size:18px;letter-spacing:-.6px}.section small{font-size:12px;color:var(--muted)}.chips{display:flex;gap:8px;overflow:auto;scrollbar-width:none;padding-bottom:8px}.chip{border:1px solid #e2e7ed;background:#fff;border-radius:99px;padding:9px 14px;white-space:nowrap;font-size:13px}.chip.active{background:#22262e;color:white;border-color:#22262e}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px;margin-top:16px}.card{min-width:0;cursor:pointer}.image{aspect-ratio:4/3;border-radius:17px;display:grid;place-items:center;background:#edf4ff;font-size:53px}.card:nth-child(3n+2) .image{background:#fff3dd}.card:nth-child(3n) .image{background:#f0f3ec}.card small{display:block;color:var(--accent);font-weight:800;font-size:11px;margin:10px 0 5px}.card h3{font-size:15px;letter-spacing:-.4px;line-height:1.45;margin:0 0 5px}.card p{font-size:12px;color:var(--muted);line-height:1.5;margin:0}.cta{margin-top:32px;background:#f5f8fd;padding:20px;border-radius:18px}.cta h3{font-size:16px;margin:0 0 7px}.cta p{font-size:12px;color:var(--muted);line-height:1.6}.cta a{display:inline-block;background:#2367e8;color:#fff;border-radius:12px;padding:11px 15px;font-size:13px;font-weight:800}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;border-top:1px solid var(--line);background:#fff;padding:10px max(6px,calc((100vw - 720px)/2)) calc(9px + env(safe-area-inset-bottom));z-index:2}.bottom a{min-width:58px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#777}.bottom b{font-size:22px;font-weight:500}.bottom .active{color:#2367e8;font-weight:800}.overlay{position:fixed;inset:0;background:#101820a3;display:none;align-items:flex-end;justify-content:center;z-index:10}.overlay.open{display:flex}.sheet{background:#fff;width:min(100%,720px);border-radius:24px 24px 0 0;padding:22px 21px calc(26px + env(safe-area-inset-bottom));max-height:87vh;overflow:auto}.sheet button{float:right;border:0;background:#f2f4f6;border-radius:12px;padding:9px 13px}.sheet h2{clear:both;font-size:23px;letter-spacing:-.8px}.sheet p{font-size:14px;line-height:1.85;white-space:pre-line}.sheet small{color:var(--accent);font-weight:800}@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body>
<div class="wrap"><header class="top"><a class="brand" href="index.html">TE<span>UM</span></a><a href="community.html">트임피드 ↗</a></header><div class="eyebrow">TEUM SPACE</div><h1>공간비움</h1><p class="intro">내가 머무는 공간에 작은 여유를.<br>정리 아이디어를 골라보고 오늘 하나만 실천해요.</p><nav class="tabs"><a href="community.html">추천</a><a href="space-feed.html" class="active">공간비움</a><a href="mind-feed.html" class="">마음비움</a><a href="community.html?tab=비움후기">비움후기</a><a href="magazine.html">매거진</a></nav>
<section class="hero"><small>TODAY'S TEUM</small><h2>오늘은 한 곳만<br>비워볼까요?</h2><p>10분 안에 할 수 있는 작은 공간 정리</p><span class="art" aria-hidden="true">⌂</span></section><div class="section"><h2>어떤 공간이 궁금하세요?</h2><small>주제별 골라보기</small></div><div class="chips" id="chips"></div><div class="section"><h2>공간별 비움 아이디어</h2><small id="count"></small></div><div class="grid" id="grid"></div><div class="cta"><h3>나도 비움 이야기를 남겨볼까요?</h3><p>나만의 변화와 작은 실천을 트임피드에 기록해보세요.</p><a href="community.html">트임피드로 이동 →</a></div></div>
<nav class="bottom"><a href="index.html"><b>⌂</b>홈</a><a href="test.html"><b>✦</b>트임AI</a><a href="action.html"><b>＋</b>비우기</a><a class="active" href="community.html"><b>▦</b>트임피드</a><a href="challenge.html"><b>◯</b>내 기록</a></nav><div class="overlay" id="overlay"><div class="sheet"><button id="close">닫기 ×</button><small id="detailCat"></small><h2 id="detailTitle"></h2><p id="detailBody"></p></div></div><script>
const data=[["옷장","옷장 앞에서 10분만","오늘 입지 않는 옷부터 한 칸 비워봐요.","👕","옷장 전체를 한 번에 정리하려고 하지 마세요. 자주 입는 옷이 있는 한 칸만 골라보세요.\\n\\n1. 해당 칸의 옷을 꺼냅니다.\\n2. 최근에 입은 옷과 그렇지 않은 옷을 구분합니다.\\n3. 남길 옷을 다시 넣고 나머지는 보류함에 모읍니다.\\n\\n작은 한 칸부터 시작하면 다음 공간도 쉽게 정리할 수 있습니다."],["책상","책상 위, 오늘 필요한 것만","눈앞의 물건 세 개부터 제자리로.","📚","책상 위에서 오늘 사용하지 않을 물건 세 개를 골라 제자리로 옮겨보세요.\\n\\n매일 쓰는 물건만 손이 닿는 곳에 두면 집중할 공간이 조금 더 넓어집니다."],["주방","싱크대 주변 가볍게 비우기","매일 쓰는 것만 남겨도 달라져요.","🍽️","싱크대 옆에 오래 놓인 물건을 살펴보세요.\\n\\n사용 빈도가 낮은 도구는 수납장으로 옮기고, 비어 있는 용기와 포장재는 분리배출 기준에 맞게 정리해보세요."],["침실","잠들기 전 침실 5분 정리","침대 옆부터 차분하게.","🛏️","침대 옆 탁자와 바닥에 놓인 물건을 제자리로 돌려놓으세요.\\n\\n내일 필요한 물건 하나만 꺼내두고 나머지는 정리하면 아침을 조금 더 가볍게 시작할 수 있습니다."],["거실","거실의 한 구역만 비우기","자주 머무는 자리부터 시작해요.","🛋️","소파 옆이나 테이블 위처럼 가장 자주 머무는 곳 하나를 정하세요.\\n\\n제자리가 없는 물건은 임시 상자에 모은 뒤 하나씩 자리를 정해보세요."],["욕실","욕실 선반 유통기한 체크","오래된 제품부터 확인해요.","🫧","욕실 선반에 있는 제품의 사용기한과 상태를 확인해보세요.\\n\\n오래되거나 사용하지 않는 제품을 구분하고, 필요한 것만 손이 닿는 곳에 배치하세요."]],cats=["전체","옷장","책상","주방","침실","거실","욕실"];let selected="전체";const chips=document.getElementById("chips"),grid=document.getElementById("grid");function render(){chips.innerHTML=cats.map(c=>'<button class="chip '+(c===selected?'active':'')+'" data-cat="'+c+'">'+c+'</button>').join('');const list=data.filter(d=>selected==='전체'||d[0]===selected);document.getElementById('count').textContent=list.length+'개의 이야기';grid.innerHTML=list.map(d=>'<article class="card" tabindex="0" role="button" data-id="'+data.indexOf(d)+'"><div class="image">'+d[3]+'</div><small>'+d[0]+'</small><h3>'+d[1]+'</h3><p>'+d[2]+'</p></article>').join('')}chips.onclick=e=>{const b=e.target.closest('[data-cat]');if(b){selected=b.dataset.cat;render()}};function show(id){const d=data[id];if(!d)return;document.getElementById('detailCat').textContent=d[0];document.getElementById('detailTitle').textContent=d[1];document.getElementById('detailBody').textContent=d[4];document.getElementById('overlay').classList.add('open')}grid.onclick=e=>{const b=e.target.closest('[data-id]');if(b)show(Number(b.dataset.id))};grid.onkeydown=e=>{if(e.key==='Enter'){const b=e.target.closest('[data-id]');if(b)show(Number(b.dataset.id))}};document.getElementById('close').onclick=()=>document.getElementById('overlay').classList.remove('open');document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')e.target.classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('overlay').classList.remove('open')});render();
</script></body></html>
