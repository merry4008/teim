  <style>
    :root{--teum-blue:#2563EB;--teum-yellow:#FFC928}body{background:#fff;color:#111827}.action-screen{padding-top:20px}.done-hero{background:var(--teum-blue);color:#fff;border-radius:34px;padding:26px 22px 24px;box-shadow:0 18px 44px rgba(37,99,235,.24)}.done-hero .small-label{color:var(--teum-yellow)}.done-hero h1{margin:0;font-size:36px;line-height:1.08;letter-spacing:-.075em}.done-hero p{margin:12px 0 0;color:rgba(255,255,255,.86);font-size:15px}.timer-card{margin-top:16px;background:#fff;border:2px solid var(--teum-blue);border-radius:34px;padding:24px 20px;text-align:center;box-shadow:0 18px 44px rgba(37,99,235,.14)}.timer-ring{--angle:144deg;width:258px;height:258px;margin:0 auto 20px;border:12px solid var(--teum-blue);border-radius:50%;display:flex;flex-direction:column;align-items:center;justify-content:center;position:relative;background:#fff;touch-action:none;user-select:none}.timer-knob{position:absolute;left:50%;top:50%;width:26px;height:26px;border-radius:50%;background:var(--teum-yellow);border:4px solid #fff;box-shadow:0 8px 22px rgba(24,59,107,.25);transform:translate(-50%,-50%) rotate(var(--angle)) translateY(-129px);cursor:grab;z-index:4}.timer-knob:active{cursor:grabbing}.timer-logo{font-weight:1000;font-style:italic;letter-spacing:-.08em;color:var(--teum-blue);font-size:24px;line-height:1;margin-bottom:8px}.timer-time{font-size:45px;font-weight:1000;color:var(--teum-blue);letter-spacing:-.05em;line-height:1}.timer-mode{margin-top:6px;font-size:11px;font-weight:950;color:var(--teum-blue);letter-spacing:.12em}.time-inline{margin-top:12px;display:inline-flex;align-items:center;gap:7px;border-radius:999px;background:#eef4ff;color:var(--teum-blue);font-size:12px;font-weight:950;padding:8px 12px}.time-inline output{background:var(--teum-yellow);color:#183B6B;border-radius:999px;padding:4px 8px;font-weight:1000}.timer-card h2{margin:0 0 8px;color:var(--teum-blue);font-size:24px;letter-spacing:-.05em}.timer-card p{margin:0;color:#4b5563;font-size:14px}.timer-actions{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:18px}.timer-actions button{border:0;border-radius:18px;padding:14px 8px;font-weight:950;font-size:14px;cursor:pointer}.timer-actions button:first-child{background:var(--teum-blue);color:#fff}.timer-actions button:nth-child(2){background:var(--teum-yellow);color:#183B6B}.timer-actions button:last-child{background:#eef4ff;color:var(--teum-blue)}.music-player{margin-top:16px;background:#183B6B;color:#fff;border-radius:34px;padding:24px 20px;box-shadow:0 18px 44px rgba(24,59,107,.22)}.music-player h2{margin:0;color:#fff;font-size:25px;letter-spacing:-.055em}.music-player>p{margin:8px 0 18px;color:rgba(255,255,255,.76);font-size:14px}.album-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}.album-card{display:block;color:#fff;background:rgba(255,255,255,.1);border:1px solid rgba(255,255,255,.16);border-radius:24px;padding:12px;text-align:left}.album-cover{aspect-ratio:1/1;border-radius:20px;background:linear-gradient(135deg,#FFC928,#fff 44%,#2563EB);position:relative;overflow:hidden;box-shadow:inset 0 0 0 1px rgba(255,255,255,.24)}.album-cover img{width:100%;height:100%;object-fit:cover;display:block}.album-cover:before{content:'';position:absolute;inset:18%;border-radius:50%;background:radial-gradient(circle at center,#183B6B 0 10px,#fff 11px 22px,#FFC928 23px 34px,#2563EB 35px 100%);box-shadow:0 8px 18px rgba(24,59,107,.22)}.album-cover:has(img){background:#fff}.album-cover:has(img):before{display:none}.album-card b{display:block;margin-top:11px;font-size:15px;letter-spacing:-.05em}.album-card span{display:block;margin-top:4px;color:rgba(255,255,255,.72);font-size:11px;line-height:1.35}.album-card em{display:inline-flex;margin-top:10px;border-radius:999px;background:#FFC928;color:#183B6B;font-style:normal;font-weight:1000;font-size:12px;padding:8px 11px}@media(max-width:640px){.done-hero{border-radius:28px;padding:23px 20px}.done-hero h1{font-size:31px}.timer-ring{width:232px;height:232px}.timer-knob{transform:translate(-50%,-50%) rotate(var(--angle)) translateY(-116px)}.timer-time{font-size:40px}.timer-logo{font-size:22px}.timer-actions{gap:6px}.timer-actions button{font-size:13px;padding:13px 6px}.music-player{border-radius:28px;padding:22px 16px}.album-grid{grid-template-columns:1fr 1fr;gap:10px}.album-card{border-radius:22px;padding:10px}.album-cover{border-radius:17px}.album-card b{font-size:14px}.album-card span{font-size:10.5px}.album-card em{font-size:11px;padding:7px 10px}}
  </style>
</head>
<body data-page="action">
  <header class="topbar"><a href="index.html" aria-label="트임 홈" style="display:flex;align-items:center"><img src="/teum-logo.png" alt="TEUM" style="display:block;height:34px;width:auto" /></a><a class="top-action" href="test.html">성향테스트</a></header>
  <main class="screen action-screen">
    <section class="done-hero"><p class="small-label">DO IT NOW</p><h1>바로 해냄</h1><p>완벽하게 끝내는 시간이 아니라, 지금 시작하게 만드는 실행 도구예요.</p></section>
    <section class="timer-card" aria-label="타이머"><div id="timerRing" class="timer-ring"><button id="timerKnob" class="timer-knob" type="button" aria-label="시간 설정 점"></button><div class="timer-logo">TEUM</div><div id="timerTime" class="timer-time">25:00</div><div id="timerMode" class="timer-mode">FOCUS</div><div class="time-inline"><span>집중 시간</span><output id="timeOutput">25분</output></div></div><h2>내가 정한 시간만큼 해내기</h2><p>동그라미 위 노란 점을 움직여 1분부터 60분까지 설정하세요.</p><div class="timer-actions"><button id="timerStart" type="button">시작</button><button id="timerPause" type="button">멈춤</button><button id="timerReset" type="button">초기화</button></div></section>
    <section class="music-player"><h2>정리할 때 듣는 음악</h2><p>기분에 따라 노동요 골라보자</p><div class="album-grid"><a class="album-card" href="https://www.youtube.com/results?search_query=%EC%8B%A0%EB%82%98%EB%8A%94+%EC%9A%B4%EB%8F%99+%EC%9D%8C%EC%95%85" target="_blank" rel="noopener"><div class="album-cover"><img src="/music_a_.png" alt="신나는 음악 앨범" /></div><b>신나는 음악</b><span>기분 끌어 올려</span><em>재생</em></a><a class="album-card" href="https://www.youtube.com/results?search_query=%EB%AA%85%EC%83%81%EC%9D%8C%EC%95%85" target="_blank" rel="noopener"><div class="album-cover"><img src="/music_b_.png" alt="명상음악 앨범" /></div><b>명상음악</b><span>마음 부담을 낮추고 차분히 시작할 때</span><em>재생</em></a><a class="album-card" href="https://www.youtube.com/results?search_query=%EC%A7%91%EC%A4%91%EC%97%90+%EC%A2%8B%EC%9D%80+%ED%81%B4%EB%9E%98%EC%8B%9D" target="_blank" rel="noopener"><div class="album-cover"><img src="/music_c_.png" alt="클래식 앨범" /></div><b>클래식</b><span>고요하게 분류하고 정돈하고 싶을 때</span><em>재생</em></a></div></section>
  </main>
  <nav class="bottom-nav"><a data-nav="home" href="index.html">홈</a><a data-nav="test" href="test.html">성향테스트</a><a data-nav="space" href="space.html">공간테스트</a><a class="active" data-nav="action" href="action.html">바로해냄</a><a data-nav="program" href="program.html">문의</a></nav>
  <script>const timerRing=document.getElementById('timerRing'),timerKnob=document.getElementById('timerKnob'),timerTime=document.getElementById('timerTime'),timerMode=document.getElementById('timerMode'),startBtn=document.getElementById('timerStart'),pauseBtn=document.getElementById('timerPause'),resetBtn=document.getElementById('timerReset'),timeOutput=document.getElementById('timeOutput');let mode='focus',focusMinutes=25,seconds=focusMinutes*60,timer=null,dragging=false;function minuteToAngle(min){return (min-1)/59*360}function setKnob(){timerRing.style.setProperty('--angle',minuteToAngle(focusMinutes)+'deg')}function render(){const m=String(Math.floor(seconds/60)).padStart(2,'0'),s=String(seconds%60).padStart(2,'0');timerTime.textContent=`${m}:${s}`;timerMode.textContent=mode==='focus'?'FOCUS':'BREAK';timeOutput.textContent=focusMinutes+'분';setKnob()}function setFocusMinutes(value){focusMinutes=Math.max(1,Math.min(60,Math.round(Number(value)||25)));if(!timer&&mode==='focus')seconds=focusMinutes*60;render()}function setByPointer(e){const rect=timerRing.getBoundingClientRect(),cx=rect.left+rect.width/2,cy=rect.top+rect.height/2;const p=e.touches?e.touches[0]:e;let deg=Math.atan2(p.clientY-cy,p.clientX-cx)*180/Math.PI+90;if(deg<0)deg+=360;setFocusMinutes(Math.round(deg/360*59)+1)}timerKnob.addEventListener('pointerdown',e=>{dragging=true;timerKnob.setPointerCapture(e.pointerId);setByPointer(e)});timerKnob.addEventListener('pointermove',e=>{if(dragging)setByPointer(e)});timerKnob.addEventListener('pointerup',()=>dragging=false);timerRing.addEventListener('pointerdown',e=>{if(e.target!==timerKnob){setByPointer(e)}});function beep(){try{const ctx=new (window.AudioContext||window.webkitAudioContext)(),osc=ctx.createOscillator(),gain=ctx.createGain();osc.connect(gain);gain.connect(ctx.destination);osc.frequency.value=880;gain.gain.value=.07;osc.start();setTimeout(()=>{osc.stop();ctx.close()},220)}catch(e){}}function switchMode(){beep();mode=mode==='focus'?'break':'focus';seconds=mode==='focus'?focusMinutes*60:5*60;render();alert(mode==='break'?'좋아요. 설정한 시간을 해냈어요! 5분 쉬어가요.':'휴식 끝! 다시 시작해볼까요?')}startBtn.onclick=()=>{if(timer)return;timer=setInterval(()=>{seconds--;if(seconds<=0){clearInterval(timer);timer=null;switchMode()}else render()},1000)};pauseBtn.onclick=()=>{clearInterval(timer);timer=null};resetBtn.onclick=()=>{clearInterval(timer);timer=null;mode='focus';seconds=focusMinutes*60;render()};render();</script>
</body>
