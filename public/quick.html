<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>퀵트임 | TEUM</title><style>:root{--blue:#2563eb;--navy:#173866;--yellow:#ffca2a}*{box-sizing:border-box}body{margin:0;background:#f7f9fc;font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--navy)}main{max-width:490px;margin:auto;padding:24px 18px 120px}.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}.top a{color:var(--navy);text-decoration:none;font-weight:800}.brand{font-size:13px;color:var(--blue);font-weight:900}.card{background:white;border:1px solid #e8edf5;border-radius:28px;padding:25px 22px;box-shadow:0 12px 36px #1738660a;min-height:430px}.eyebrow{font-size:12px;font-weight:900;color:var(--blue);letter-spacing:.05em}.progress{height:5px;border-radius:9px;background:#edf1f7;margin:15px 0 27px;overflow:hidden}.progress i{display:block;height:100%;background:var(--blue);transition:width .25s}h1{font-size:26px;line-height:1.32;letter-spacing:-.05em;margin:0 0 10px}p{line-height:1.65;color:#66758c;margin:0 0 20px;font-size:14px}.choices{display:grid;gap:10px}.choice{border:1px solid #e5eaf3;background:white;border-radius:17px;padding:17px;text-align:left;color:var(--navy);font-size:15px;font-weight:750;cursor:pointer}.choice.selected{background:#edf4ff;border:2px solid var(--blue);padding:16px}.footer{display:flex;gap:10px;margin-top:25px}.btn{border:0;border-radius:16px;padding:16px;font-size:15px;font-weight:850;cursor:pointer}.primary{background:var(--blue);color:white;flex:1}.secondary{background:#eef2f7;color:var(--navy)}button:disabled{opacity:.4;cursor:default}.result-pill{display:inline-block;background:#fff3c7;padding:8px 12px;border-radius:50px;font-size:12px;font-weight:900;margin-bottom:15px}.mission{border-radius:22px;background:#f0f5ff;padding:21px;margin:19px 0}.mission h2{font-size:23px;letter-spacing:-.05em;line-height:1.35;margin:8px 0}.mission p{margin:0}.steps{padding-left:21px;line-height:1.8;font-size:14px}.done-icon{font-size:48px;text-align:center;margin:20px}.center{text-align:center}.count{font-weight:900;color:var(--blue);font-size:18px}.hidden{display:none!important}</style></head><body><main><div class="top"><a href="index.html">← 홈으로</a><span class="brand">TEUM · QUICK</span></div><section class="card" id="app"></section></main><script>const data={love:{bed:[['추억이 담긴 물건 하나 치우기','버릴 필요는 없어요. 오늘은 눈에 보이지 않는 곳으로 잠시 옮겨두세요.'],['사진 한 장만 숨기기','자꾸 눈이 가는 사진 한 장만 오늘은 보이지 않게 해볼까요?'],['선물 하나 자리 바꾸기','기억이 붙은 물건 하나의 위치만 바꿔도 공간의 느낌이 달라져요.']],desk:[['메모 하나 정리하기','남겨둔 메모나 쪽지 하나를 골라 정리해보세요.'],['사진 3장 정리하기','삭제가 부담스럽다면 숨김 앨범으로 옮겨도 충분해요.'],['추억 물건 하나 서랍에 넣기','자꾸 마주치는 물건 하나만 시야에서 치워보세요.']],living:[['함께 쓰던 물건 하나 자리 바꾸기','버리지 않아도 괜찮아요. 지금의 공간에 맞는 자리로 옮겨보세요.'],['추억 물건 하나 치우기','오늘은 하나만 덜 마주치는 연습을 해볼게요.'],['선물 하나 보관함으로 옮기기','고마운 기억과 계속 꺼내두는 것은 다른 일이에요.']],outside:[['채팅방 알림 하나 끄기','자꾸 확인하게 되는 대화 하나만 오늘은 조용히 만들어보세요.'],['사진 한 장 즐겨찾기 해제하기','삭제 대신 자주 보이는 자리에서만 내려놓아도 충분해요.'],['연락처 즐겨찾기 하나 정리하기','습관처럼 누르는 연락처 하나를 즐겨찾기에서 내려보세요.']]},work:{bed:[['업무 알림 하나 끄기','쉬는 공간에서는 업무 하나만 덜 들어오게 해볼까요?'],['내일 할 일 하나 메모하고 닫기','머릿속에서 반복되는 일 하나를 적고 오늘은 내려놓으세요.'],['침대 위 업무 물건 하나 치우기','노트북이나 서류 하나를 다른 자리로 옮겨보세요.']],desk:[['열어둔 창 3개 닫기','모든 일을 끝내지 않아도 돼요. 지금 필요 없는 창 3개만 닫아보세요.'],['업무 물건 하나 제자리로','가장 먼저 눈에 들어오는 물건 하나만 돌려놓으세요.'],['오늘 안 해도 되는 할 일 하나 지우기','할 일을 늘리는 대신 하나를 덜어내는 것도 정리예요.']],living:[['업무 물건 하나 제자리로 보내기','거실까지 따라온 업무 물건 하나를 원래 자리로 돌려보세요.'],['업무 알림 10분 끄기','딱 10분만 일과 생활 사이에 틈을 만들어보세요.'],['가방 속 영수증 하나 버리기','퇴근 후까지 남아 있는 업무 흔적 하나만 정리해볼까요?']],outside:[['오늘 안 해도 되는 일 하나 미루기','미루는 게 아니라 우선순위를 다시 정하는 거예요.'],['업무 앱 알림 하나 끄기','지금 당장 필요하지 않은 알림 하나만 줄여보세요.'],['업무 탭 3개 닫기','휴대폰에 열어둔 업무 탭부터 가볍게 줄여보세요.']]},family:{bed:[['내 공간의 가족 물건 하나 옮기기','내가 쉬는 자리만큼은 내 공간으로 조금 되돌려볼게요.'],['가족 관련 메모 하나 정리하기','이미 끝난 일정이나 메모 하나를 지워보세요.'],['내 물건 하나 내 자리로 가져오기','섞여 있던 물건 하나부터 내 공간의 경계를 만들어보세요.']],desk:[['가족 관련 종이 하나 정리하기','쌓여 있던 안내문이나 서류 한 장만 분류해보세요.'],['공용 물건 하나 자리 정하기','누구의 것인지 애매한 물건 하나에 자리를 만들어주세요.'],['타인 물건 하나 돌려놓기','버리지 말고 주인에게 돌려놓는 것만으로 충분해요.']],living:[['내 물건 하나 내 공간으로 가져오기','공용공간과 내 공간의 경계를 하나만 만들어볼까요?'],['주인 없는 물건 하나 임시함에 넣기','누구 것인지 모르면 버리지 말고 한곳에 모아두세요.'],['소파 위 물건 하나 제자리로','가족 전체를 움직이기보다 내가 할 수 있는 하나만 해보세요.']],outside:[['답장 하나 잠시 미루기','지금 바로 답하지 않아도 되는 연락이라면 잠시 미뤄보세요.'],['가족 단톡 알림 10분 끄기','관계를 끊는 게 아니라 잠깐 나에게 집중하는 시간이에요.'],['부탁 하나 메모하고 생각 멈추기','기억하려 애쓰지 말고 적어두고 지금은 내려놓으세요.']]},study:{bed:[['공부 물건 하나 책상으로 옮기기','침대는 쉬는 자리로, 공부 물건 하나만 제자리로 돌려보세요.'],['내일 볼 책 한 권만 꺼내두기','많이 준비하지 말고 시작할 한 권만 정해보세요.'],['휴대폰을 손 닿지 않는 곳에 두기','딱 10분 동안만 시야와 손에서 휴대폰을 치워보세요.']],desk:[['필요 없는 종이 한 장 버리기','책상 전체 말고 지금 필요 없는 종이 딱 한 장만 골라보세요.'],['펜 3개만 남기기','지금 쓸 도구만 남기고 나머지는 서랍에 넣어보세요.'],['책상 한 뼘 비우기','공부를 시작할 만큼의 작은 자리만 만들어보세요.']],living:[['공부할 물건 하나만 꺼내놓기','시작에 필요한 것 하나만 보이게 두세요.'],['가방 속 종이 한 장 정리하기','오래된 프린트나 영수증 한 장만 골라보세요.'],['공부 자리의 컵 하나 치우기','집중을 방해하는 작은 물건 하나만 제자리로 보내세요.']],outside:[['방해 앱 하나 홈 화면에서 치우기','삭제하지 않아도 돼요. 첫 화면에서만 빼보세요.'],['열린 탭 3개 닫기','지금 공부와 관계없는 탭 3개만 닫아보세요.'],['할 일 하나만 오늘로 남기기','목록 전체 대신 지금 시작할 하나만 골라보세요.']]},self:{bed:[['베개 주변 물건 하나 치우기','쉬는 자리에 있는 물건 하나만 제자리로 보내보세요.'],['알람 하나 끄기','더 이상 필요 없는 알람 하나를 찾아 꺼보세요.'],['침대 위 옷 한 벌 치우기','방 전체 말고 옷 한 벌만 정리해볼까요?']],desk:[['오늘 안 할 일 하나 지우기','해야 할 것보다 하지 않아도 될 것을 하나 정해보세요.'],['눈에 거슬리는 물건 하나 치우기','가장 먼저 보이는 하나만 움직여보세요.'],['빈 컵 하나 치우기','아주 작은 완료감부터 만들어볼게요.']],living:[['눈에 거슬리는 물건 하나 제자리로','공간 전체가 아니라 하나만 바꿔보세요.'],['쿠션 하나 바로 놓기','10초면 끝나는 변화부터 시작해도 충분해요.'],['테이블 위 물건 3개만 치우기','세 개를 넘기지 마세요. 오늘은 작게 끝내는 게 목표예요.']],outside:[['이어폰을 빼고 1분 있기','무언가를 더 듣기보다 1분만 비워볼게요.'],['휴대폰 알림 하나 끄기','지금 나에게 필요 없는 알림 하나만 줄여보세요.'],['스크린샷 3장 지우기','의미 없는 정보 세 장만 비워보세요.']]}};
const questions=[{title:"요즘 나를 가장 답답하게 하는 건?",hint:"지금 가장 신경 쓰이는 것 하나만 골라주세요.",choices:[["사람 때문에 마음이 복잡해요","love"],["해야 할 일이 너무 많아요","work"],["주변이 어수선해서 신경 쓰여요","space"],["그냥 아무것도 하기 싫어요","self"],["생각이 너무 많아서 피곤해요","study"]]},{title:"지금 어디에서 시간을 보내고 있나요?",hint:"지금 바로 작은 변화를 만들 수 있는 곳을 골라주세요.",choices:[["침대에서 쉬는 중","bed"],["책상 앞에 앉아 있어요","desk"],["거실이나 방에 있어요","living"],["집 밖에 있어요","outside"]]},{title:"지금 어느 정도까지 할 수 있을까요?",hint:"무리하지 않아도 괜찮아요.",choices:[["딱 1분만 해볼래요",1],["5분 정도는 괜찮아요",5],["10분 정도 제대로 해볼래요",10]]}];let step=0,answers=[null,null,null],last=-1,mission=null;const app=document.querySelector("#app");function render(){let q=questions[step];app.innerHTML='<div class="eyebrow">QUICK TEUM · '+(step+1).toString().padStart(2,"0")+' / 03</div><div class="progress"><i style="width:'+((step+1)/3*100)+'%"></i></div><h1>'+q.title+'</h1><p>'+q.hint+'</p><div class="choices">'+q.choices.map(([label,val],i)=>'<button class="choice '+(answers[step]===val?'selected':'')+'" data-choice="'+i+'">'+label+'</button>').join('')+'</div><div class="footer">'+(step?'<button class="btn secondary" id="back">이전</button>':'')+'<button class="btn primary" id="next" '+(answers[step]===null?'disabled':'')+'>'+(step===2?'내 비움 미션 보기':'다음')+' →</button></div>';app.querySelectorAll("[data-choice]").forEach(b=>b.onclick=()=>{answers[step]=q.choices[Number(b.dataset.choice)][1];render()});const back=app.querySelector("#back");if(back)back.onclick=()=>{step--;render()};app.querySelector("#next").onclick=()=>{if(answers[step]===null)return;if(step<2){step++;render()}else result()}}function result(){let [concern,space,minutes]=answers;let group=concern==="space"?"self":concern;const pool=data[group][space];let i=Math.floor(Math.random()*pool.length);if(i===last)i=(i+1)%pool.length;last=i;mission=pool[i];const intro={love:"마음이 복잡할 땐 눈에 보이는 것 하나부터 정리해봐요.",work:"할 일이 많을수록 작은 완료 하나가 필요해요.",space:"주변이 어수선하다면 작은 자리부터 비워봐요.",self:"의욕이 없는 날에도 아주 작은 변화는 가능해요.",study:"생각이 많을 땐 눈앞의 한 가지부터 시작해봐요."};app.innerHTML='<span class="result-pill">✨ 오늘의 맞춤 트임</span><h1>'+intro[concern]+'</h1><p>지금 있는 곳에서 '+minutes+'분만 나를 위해 써볼까요?</p><div class="mission"><span class="eyebrow">오늘 딱 하나</span><h2>'+mission[0]+'</h2><p>'+mission[1]+'</p></div><b>이렇게 해보세요</b><ol class="steps"><li>지금 눈앞에서 해당 물건이나 항목을 찾아요.</li><li>'+minutes+'분 안에 가능한 만큼만 실행해요.</li><li>끝났다면 아래 완료 버튼을 눌러주세요.</li></ol><button class="btn primary" style="width:100%" id="complete">비웠어요! ✓</button><div class="footer"><button class="btn secondary" id="again">다른 미션 보기 ↻</button><button class="btn secondary" id="back">질문 다시 선택</button></div>';app.querySelector("#complete").onclick=done;app.querySelector("#again").onclick=result;app.querySelector("#back").onclick=()=>{step=0;render()}}function done(){const n=Number(localStorage.getItem("teimQuickCount")||0)+1;localStorage.setItem("teimQuickCount",n);const record={title:mission[0],description:mission[1],minutes:answers[2],completedAt:new Date().toISOString()};const saved=JSON.parse(localStorage.getItem("teimQuickRecords")||"[]");saved.unshift(record);localStorage.setItem("teimQuickRecords",JSON.stringify(saved.slice(0,100)));app.innerHTML='<div class="done-icon">✨</div><h1 class="center">오늘도 하나 비웠어요!</h1><p class="center">작은 행동 하나로 나만의 틈을 만들었어요.</p><p class="center count">누적 '+n+'번의 트임</p><div class="mission"><b>오늘의 트임기록</b><h2>'+mission[0]+'</h2><p>이 기기에 완료 기록을 저장했어요.</p></div><button class="btn primary" style="width:100%" id="more">하나 더 비워보기</button><div class="footer"><a class="btn secondary" style="text-decoration:none;text-align:center;flex:1" href="mind.html">마음비움으로 이어가기 →</a></div>';app.querySelector("#more").onclick=()=>{step=0;answers=[null,null,null];render()}}render();</script></body></html>
