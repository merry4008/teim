<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#2367e8"><title>퀵트임 | TEUM</title><link rel="stylesheet" href="styles.css"><style>body{background:#f7f8fb;font-family:system-ui,-apple-system,'Noto Sans KR',sans-serif;color:#15264b}.quick-page{max-width:650px;margin:auto;padding:22px 18px 110px}.quick-teim{border-radius:26px}.quick-back{display:inline-block;margin-bottom:16px;color:#2367e8;font-weight:800;text-decoration:none}.quick-intro h2{font-size:28px}.quick-result[hidden],.quick-step[hidden]{display:none!important}.quick-done .primary-cta{display:block;background:#2367e8;color:white;padding:14px;border-radius:14px;text-decoration:none}</style></head><body><main class="quick-page"><a class="quick-back" href="index.html">← 홈으로</a><section id="quickTeimExperience" class="quick-teim soft-card"><div class="quick-intro"><p class="small-label">TRY TEIM</p><h2>지금 딱 하나만 비워볼까요?</h2><p>설명보다 한 번 경험해보세요.<br>지금 마음과 공간에 맞는 작은 비움 하나를 골라드릴게요.</p></div><div id="quickTeimApp" class="quick-app"><div class="quick-step" data-step="concern"><b>요즘 가장 답답한 건?</b><div class="quick-options"><button type="button" data-concern="love">연애</button><button type="button" data-concern="work">직장</button><button type="button" data-concern="family">가족</button><button type="button" data-concern="study">학업</button><button type="button" data-concern="self">나 자신</button></div></div><div class="quick-step" data-step="space" hidden><b>지금 어디에 있나요?</b><div class="quick-options"><button type="button" data-space="bed">침대</button><button type="button" data-space="desk">책상</button><button type="button" data-space="living">거실</button><button type="button" data-space="outside">밖</button></div></div><div id="quickResult" class="quick-result" hidden></div></div></section></main><script>function initQuickTeim(){
 const app=document.querySelector('#quickTeimApp');if(!app)return;let concern='',space='',last=-1;
 const data={love:{bed:[['추억이 담긴 물건 하나 치우기','버릴 필요는 없어요. 오늘은 눈에 보이지 않는 곳으로 잠시 옮겨두세요.'],['사진 한 장만 숨기기','자꾸 눈이 가는 사진 한 장만 오늘은 보이지 않게 해볼까요?'],['선물 하나 자리 바꾸기','기억이 붙은 물건 하나의 위치만 바꿔도 공간의 느낌이 달라져요.']],desk:[['메모 하나 정리하기','남겨둔 메모나 쪽지 하나를 골라 정리해보세요.'],['사진 3장 정리하기','삭제가 부담스럽다면 숨김 앨범으로 옮겨도 충분해요.'],['추억 물건 하나 서랍에 넣기','자꾸 마주치는 물건 하나만 시야에서 치워보세요.']],living:[['함께 쓰던 물건 하나 자리 바꾸기','버리지 않아도 괜찮아요. 지금의 공간에 맞는 자리로 옮겨보세요.'],['추억 물건 하나 치우기','오늘은 하나만 덜 마주치는 연습을 해볼게요.'],['선물 하나 보관함으로 옮기기','고마운 기억과 계속 꺼내두는 것은 다른 일이에요.']],outside:[['채팅방 알림 하나 끄기','자꾸 확인하게 되는 대화 하나만 오늘은 조용히 만들어보세요.'],['사진 한 장 즐겨찾기 해제하기','삭제 대신 자주 보이는 자리에서만 내려놓아도 충분해요.'],['연락처 즐겨찾기 하나 정리하기','습관처럼 누르는 연락처 하나를 즐겨찾기에서 내려보세요.']]},work:{bed:[['업무 알림 하나 끄기','쉬는 공간에서는 업무 하나만 덜 들어오게 해볼까요?'],['내일 할 일 하나 메모하고 닫기','머릿속에서 반복되는 일 하나를 적고 오늘은 내려놓으세요.'],['침대 위 업무 물건 하나 치우기','노트북이나 서류 하나를 다른 자리로 옮겨보세요.']],desk:[['열어둔 창 3개 닫기','모든 일을 끝내지 않아도 돼요. 지금 필요 없는 창 3개만 닫아보세요.'],['업무 물건 하나 제자리로','가장 먼저 눈에 들어오는 물건 하나만 돌려놓으세요.'],['오늘 안 해도 되는 할 일 하나 지우기','할 일을 늘리는 대신 하나를 덜어내는 것도 정리예요.']],living:[['업무 물건 하나 제자리로 보내기','거실까지 따라온 업무 물건 하나를 원래 자리로 돌려보세요.'],['업무 알림 10분 끄기','딱 10분만 일과 생활 사이에 틈을 만들어보세요.'],['가방 속 영수증 하나 버리기','퇴근 후까지 남아 있는 업무 흔적 하나만 정리해볼까요?']],outside:[['오늘 안 해도 되는 일 하나 미루기','미루는 게 아니라 우선순위를 다시 정하는 거예요.'],['업무 앱 알림 하나 끄기','지금 당장 필요하지 않은 알림 하나만 줄여보세요.'],['업무 탭 3개 닫기','휴대폰에 열어둔 업무 탭부터 가볍게 줄여보세요.']]},family:{bed:[['내 공간의 가족 물건 하나 옮기기','내가 쉬는 자리만큼은 내 공간으로 조금 되돌려볼게요.'],['가족 관련 메모 하나 정리하기','이미 끝난 일정이나 메모 하나를 지워보세요.'],['내 물건 하나 내 자리로 가져오기','섞여 있던 물건 하나부터 내 공간의 경계를 만들어보세요.']],desk:[['가족 관련 종이 하나 정리하기','쌓여 있던 안내문이나 서류 한 장만 분류해보세요.'],['공용 물건 하나 자리 정하기','누구의 것인지 애매한 물건 하나에 자리를 만들어주세요.'],['타인 물건 하나 돌려놓기','버리지 말고 주인에게 돌려놓는 것만으로 충분해요.']],living:[['내 물건 하나 내 공간으로 가져오기','공용공간과 내 공간의 경계를 하나만 만들어볼까요?'],['주인 없는 물건 하나 임시함에 넣기','누구 것인지 모르면 버리지 말고 한곳에 모아두세요.'],['소파 위 물건 하나 제자리로','가족 전체를 움직이기보다 내가 할 수 있는 하나만 해보세요.']],outside:[['답장 하나 잠시 미루기','지금 바로 답하지 않아도 되는 연락이라면 잠시 미뤄보세요.'],['가족 단톡 알림 10분 끄기','관계를 끊는 게 아니라 잠깐 나에게 집중하는 시간이에요.'],['부탁 하나 메모하고 생각 멈추기','기억하려 애쓰지 말고 적어두고 지금은 내려놓으세요.']]},study:{bed:[['공부 물건 하나 책상으로 옮기기','침대는 쉬는 자리로, 공부 물건 하나만 제자리로 돌려보세요.'],['내일 볼 책 한 권만 꺼내두기','많이 준비하지 말고 시작할 한 권만 정해보세요.'],['휴대폰을 손 닿지 않는 곳에 두기','딱 10분 동안만 시야와 손에서 휴대폰을 치워보세요.']],desk:[['필요 없는 종이 한 장 버리기','책상 전체 말고 지금 필요 없는 종이 딱 한 장만 골라보세요.'],['펜 3개만 남기기','지금 쓸 도구만 남기고 나머지는 서랍에 넣어보세요.'],['책상 한 뼘 비우기','공부를 시작할 만큼의 작은 자리만 만들어보세요.']],living:[['공부할 물건 하나만 꺼내놓기','시작에 필요한 것 하나만 보이게 두세요.'],['가방 속 종이 한 장 정리하기','오래된 프린트나 영수증 한 장만 골라보세요.'],['공부 자리의 컵 하나 치우기','집중을 방해하는 작은 물건 하나만 제자리로 보내세요.']],outside:[['방해 앱 하나 홈 화면에서 치우기','삭제하지 않아도 돼요. 첫 화면에서만 빼보세요.'],['열린 탭 3개 닫기','지금 공부와 관계없는 탭 3개만 닫아보세요.'],['할 일 하나만 오늘로 남기기','목록 전체 대신 지금 시작할 하나만 골라보세요.']]},self:{bed:[['베개 주변 물건 하나 치우기','쉬는 자리에 있는 물건 하나만 제자리로 보내보세요.'],['알람 하나 끄기','더 이상 필요 없는 알람 하나를 찾아 꺼보세요.'],['침대 위 옷 한 벌 치우기','방 전체 말고 옷 한 벌만 정리해볼까요?']],desk:[['오늘 안 할 일 하나 지우기','해야 할 것보다 하지 않아도 될 것을 하나 정해보세요.'],['눈에 거슬리는 물건 하나 치우기','가장 먼저 보이는 하나만 움직여보세요.'],['빈 컵 하나 치우기','아주 작은 완료감부터 만들어볼게요.']],living:[['눈에 거슬리는 물건 하나 제자리로','공간 전체가 아니라 하나만 바꿔보세요.'],['쿠션 하나 바로 놓기','10초면 끝나는 변화부터 시작해도 충분해요.'],['테이블 위 물건 3개만 치우기','세 개를 넘기지 마세요. 오늘은 작게 끝내는 게 목표예요.']],outside:[['이어폰을 빼고 1분 있기','무언가를 더 듣기보다 1분만 비워볼게요.'],['휴대폰 알림 하나 끄기','지금 나에게 필요 없는 알림 하나만 줄여보세요.'],['스크린샷 3장 지우기','의미 없는 정보 세 장만 비워보세요.']]}};
 const cs=app.querySelector('[data-step="concern"]'),ss=app.querySelector('[data-step="space"]'),out=app.querySelector('#quickResult');
 cs.onclick=e=>{const b=e.target.closest('[data-concern]');if(!b)return;concern=b.dataset.concern;cs.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));ss.hidden=false;out.hidden=true};
 ss.onclick=e=>{const b=e.target.closest('[data-space]');if(!b)return;space=b.dataset.space;ss.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));show()};
 function show(){const a=data[concern][space];let i=Math.floor(Math.random()*3);if(i===last)i=(i+1)%3;last=i;const v=a[i];out.hidden=false;out.innerHTML='<span class="quick-badge">오늘의 트임</span><h3>'+v[0]+'</h3><p>'+v[1]+'</p><button class="quick-complete" type="button">비웠어요</button><button class="quick-again" type="button">↻ 다른 트임 해볼래요</button>';out.querySelector('.quick-complete').onclick=done;out.querySelector('.quick-again').onclick=show}
 function done(){const n=Number(localStorage.getItem('teimQuickCount')||0)+1;localStorage.setItem('teimQuickCount',n);out.innerHTML='<div class="quick-done"><div class="sun">☀️</div><h3>틈이 하나 생겼어요.</h3><p>방금 경험한 게 트임이에요.<br>마음의 답답함을 작은 공간의 변화로 연결합니다.</p><strong>+1 트임 · 지금까지 '+n+'번</strong><a class="primary-cta" href="test.html">나를 더 알아보기 → 성향테스트</a><button class="quick-again" type="button">↻ 하나 더 비워보기</button></div>';out.querySelector('.quick-again').onclick=show}
}
initQuickTeim();</script><script src="teum-bottom-nav.js" defer></script></body></html>
