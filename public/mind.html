<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>마음비움 | TEUM</title><style>
:root{--b:#2367e8;--n:#15264b;--y:#ffda52;--bg:#f6f8fc;--m:#7a879d;--line:#e7ebf2}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif;color:var(--n)}button{font:inherit;color:inherit}.app{max-width:720px;margin:auto;min-height:100vh;background:#fff;padding-bottom:40px}.top{height:82px;display:flex;align-items:center;justify-content:space-between;padding:0 24px;border-bottom:1px solid #f0f2f6}.top a{text-decoration:none;color:var(--n);font-size:25px}.top b{font-size:19px}.save{font-size:13px;color:var(--b);font-weight:800}.progress{height:4px;background:#edf1f7}.progress i{display:block;height:100%;background:var(--b);width:0;transition:.3s}.page{padding:30px 24px}.ey{color:var(--b);font-weight:900;font-size:13px;letter-spacing:.1em}.page h1{font-size:32px;line-height:1.2;letter-spacing:-.055em;margin:10px 0}.desc{color:var(--m);line-height:1.6;margin-bottom:28px}.wheelWrap{background:#f8f9fc;border:1px solid var(--line);border-radius:26px;padding:22px;margin:18px 0}.wheelWrap label{font-weight:850;display:block;margin-bottom:12px}.wheel{height:150px;overflow:auto;scroll-snap-type:y mandatory;text-align:center;padding:50px 0}.wheel::-webkit-scrollbar{display:none}.wheel button{display:block;width:100%;height:50px;border:0;background:transparent;scroll-snap-align:center;font-size:16px;color:#a0a9b8}.wheel button.sel{font-size:22px;font-weight:900;color:var(--n)}.next{width:100%;border:0;border-radius:20px;background:var(--b);color:white;font-weight:900;padding:19px;margin-top:15px}.cards{display:grid;gap:12px;margin-top:24px}.card{border:1px solid var(--line);background:#fff;border-radius:22px;padding:20px;text-align:left;font-weight:800;line-height:1.4}.card small{display:block;color:var(--m);font-weight:500;margin-top:6px}.card:active,.card.sel{border-color:var(--b);background:#eef4ff}.count{color:var(--m);font-size:13px;margin-bottom:8px}.result{background:#eef4ff;border-radius:28px;padding:26px;margin-top:20px}.result h2{font-size:27px;letter-spacing:-.045em;margin:8px 0 12px}.result p{line-height:1.65;color:#53627a}.actions{display:grid;gap:10px;margin-top:20px}.actions a{text-decoration:none;text-align:center;padding:17px;border-radius:18px;font-weight:850}.primary{background:var(--b);color:#fff}.secondary{background:#fff;color:var(--n);border:1px solid var(--line)}.hidden{display:none}
</style></head><body data-teum-shell="ai"><main class="app"><header class="top"><a href="index.html">‹</a><b>마음비움</b><span class="save">자동 저장</span></header><div class="progress"><i id="bar"></i></div><section class="page" id="root"></section></main><script>
const root=document.getElementById('root'),bar=document.getElementById('bar');
let state=JSON.parse(localStorage.getItem('teumMind')||'{}'),step=0;
const wheels=[
 {k:'life',q:'요즘 생활 리듬은 어때요?',v:['아주 여유로워요','조금 여유로워요','보통이에요','조금 바빠요','정신없이 바빠요']},
 {k:'energy',q:'평소 에너지는 어느 쪽에 가까워요?',v:['에너지가 많은 편','보통인 편','쉽게 지치는 편','회복이 필요한 편']},
 {k:'alone',q:'혼자 쉴 수 있는 시간은 어느 정도예요?',v:['거의 없어요','하루 10분 정도','하루 30분 정도','1시간 이상','충분한 편이에요']}
];
const qs=[
 ['오늘 마음에서 가장 비우고 싶은 건?',['생각이 너무 많아요','일 때문에 머리가 복잡해요','관계 때문에 마음이 쓰여요','해야 할 일이 계속 떠올라요','그냥 아무것도 하고 싶지 않아요']],
 ['지금 가장 필요한 느낌은?',['머릿속을 잠깐 멈추고 싶어요','마음을 가볍게 하고 싶어요','해야 할 걸 하나만 정하고 싶어요','누군가에게 털어놓고 싶어요','그냥 조용히 쉬고 싶어요']],
 ['오늘 마음에 쓸 수 있는 시간은?',['3분이면 좋아요','5분 정도','10분 정도','조금 더 천천히 할래요']]
];
function save(){localStorage.setItem('teumMind',JSON.stringify(state))}
function renderWheel(){bar.style.width='20%';root.innerHTML='<div class="ey">STEP 01 · 기본 상황</div><h1>먼저, 나를 가볍게 알려주세요.</h1><p class="desc">기본 상황은 한 번만 골라두면 다음 추천에도 활용할 수 있어요.</p>'+wheels.map(w=>'<div class="wheelWrap"><label>'+w.q+'</label><div class="wheel">'+w.v.map((x,i)=>'<button data-k="'+w.k+'" data-v="'+x+'" class="'+((state[w.k]||w.v[Math.floor(w.v.length/2)])===x?'sel':'')+'">'+x+'</button>').join('')+'</div></div>').join('')+'<button class="next" id="go">오늘 마음 살펴보기 →</button>';root.querySelectorAll('.wheel button').forEach(b=>b.onclick=()=>{state[b.dataset.k]=b.dataset.v;save();[...b.parentElement.children].forEach(x=>x.classList.remove('sel'));b.classList.add('sel')});document.getElementById('go').onclick=()=>{step=1;renderQ()}}
function renderQ(){let qi=step-1;if(qi>=qs.length)return result();bar.style.width=(20+(step)*20)+'%';root.innerHTML='<div class="count">'+(qi+1)+' / '+qs.length+'</div><div class="ey">오늘의 마음</div><h1>'+qs[qi][0]+'</h1><p class="desc">지금 가장 가까운 하나만 골라주세요.</p><div class="cards">'+qs[qi][1].map(x=>'<button class="card">'+x+'</button>').join('')+'</div>';root.querySelectorAll('.card').forEach(b=>b.onclick=()=>{state['q'+qi]=b.textContent;save();step++;renderQ()})}
function result(){bar.style.width='100%';let need=state.q1||'마음을 가볍게 하고 싶어요',time=state.q2||'5분 정도';let action=need.includes('멈추')?'지금 떠오르는 생각 3개만 메모하고 화면을 덮어보세요.':need.includes('하나')?'해야 할 일을 전부 해결하지 말고, 오늘 끝낼 한 가지만 골라보세요.':need.includes('털어')?'마음에 걸리는 일을 한 문장으로 적어보세요. 해결보다 꺼내놓는 게 먼저예요.':'눈에 보이는 것 하나를 잠시 내려놓고 '+time.replace('이면 좋아요','')+' 동안 아무것도 정리하지 않아도 괜찮아요.';root.innerHTML='<div class="ey">TODAY\'S MIND TEUM</div><h1>오늘은 이만큼만<br>비워볼까요?</h1><div class="result"><span>오늘의 1트</span><h2>'+action+'</h2><p>지금 상태에 맞춰 크게 바꾸기보다 바로 할 수 있는 한 가지를 골랐어요.</p></div><div class="actions"><a class="primary" href="action.html">트임타임으로 시작하기</a><a class="secondary" href="challenge.html">완료하고 기록하기</a><a class="secondary" href="#" id="again">오늘 상태 다시 고르기</a></div>';document.getElementById('again').onclick=e=>{e.preventDefault();step=1;renderQ()}}
renderWheel();
</script></body></html>
