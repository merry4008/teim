<!doctype html>
<html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>트임피드 | 다른 사람들의 트임</title>
<style>
:root{--blue:#2367e8;--yellow:#ffdb52;--ink:#20252c;--muted:#7c838d;--line:#edf0f3}*{box-sizing:border-box}body{margin:0;color:var(--ink);font-family:system-ui,-apple-system,"Pretendard","Noto Sans KR",sans-serif;background:#fff}button,input,select,textarea{font:inherit}button{cursor:pointer}a{text-decoration:none;color:inherit}.wrap{max-width:720px;margin:auto;padding:0 18px 110px}.head{height:68px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:900;letter-spacing:-1px}.brand span{color:var(--blue)}.head-actions{display:flex;gap:10px}.icon-btn{border:0;background:#f5f7fa;border-radius:14px;width:42px;height:42px;font-size:21px}.intro{padding:17px 0 16px}.intro small{color:var(--blue);font-size:11px;font-weight:800;letter-spacing:.1em}.intro h1{font-size:27px;letter-spacing:-1.5px;margin:8px 0}.intro p{font-size:13px;color:var(--muted);margin:0;line-height:1.6}.tabs{display:flex;gap:25px;overflow-x:auto;border-bottom:1px solid var(--line);scrollbar-width:none}.tabs button{white-space:nowrap;padding:15px 0;border:0;background:none;color:#90959d;font-size:15px;font-weight:700}.tabs button.active{color:var(--ink);border-bottom:3px solid var(--blue)}.section-title{display:flex;justify-content:space-between;align-items:center;margin:26px 0 12px}.section-title h2{font-size:18px;margin:0;letter-spacing:-.7px}.section-title small{color:var(--muted);font-size:12px}.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px 0 8px}.chip{flex:0 0 auto;background:#fff;border:1px solid #e3e7ec;border-radius:999px;padding:9px 15px;font-size:13px;color:#555}.chip.active{background:#20252c;border-color:#20252c;color:white}.toolbar{display:flex;gap:8px;margin:16px 0}.toolbar input,.toolbar select{border:1px solid #e4e8ee;border-radius:12px;padding:11px 12px;min-width:0;background:white;font-size:13px}.toolbar input{flex:1;width:50%}.toolbar select{width:105px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:20px 12px}.post{min-width:0;cursor:pointer}.cover{aspect-ratio:4/5;border-radius:17px;overflow:hidden;background:#f2f4f6;position:relative;display:grid;place-items:center}.cover img{width:100%;height:100%;object-fit:cover}.placeholder{font-size:56px}.pill{position:absolute;top:10px;left:10px;background:rgba(255,255,255,.9);font-size:11px;border-radius:99px;padding:6px 9px}.post h3{font-size:14px;line-height:1.45;margin:10px 1px 5px;letter-spacing:-.4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.post .meta{font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:5px}.empty{text-align:center;background:#f7f9fc;border-radius:20px;padding:38px 16px;color:#7d858e;font-size:13px;grid-column:1/-1}.empty strong{display:block;color:#20252c;font-size:17px;margin-bottom:8px}.hint{margin:20px 0 0;background:#f5f8ff;border-radius:15px;padding:14px;font-size:12px;color:#617086;line-height:1.6}.fab{position:fixed;bottom:95px;right:max(18px,calc((100vw - 720px)/2 + 20px));border:0;border-radius:999px;background:var(--blue);color:#fff;box-shadow:0 7px 25px #2367e84a;padding:14px 20px;font-weight:800;z-index:5}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:11px max(6px,calc((100vw - 720px)/2)) calc(10px + env(safe-area-inset-bottom));z-index:6}.bottom a{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#7c838d;min-width:60px}.bottom a b{font-size:22px;font-weight:500}.bottom a.active{color:var(--blue);font-weight:800}.modal{position:fixed;inset:0;background:#1118;z-index:10;display:none;align-items:flex-end;justify-content:center}.modal.open{display:flex}.sheet{background:white;width:min(100%,720px);border-radius:25px 25px 0 0;padding:22px 20px calc(24px + env(safe-area-inset-bottom));max-height:90vh;overflow:auto}.sheet-top{display:flex;justify-content:space-between;align-items:center;margin-bottom:18px}.sheet-top h2{margin:0;font-size:20px}.close{background:#f4f5f6;border:0;border-radius:12px;padding:8px 13px}.field{display:block;font-size:13px;font-weight:750;margin:14px 0 6px}.sheet input,.sheet select,.sheet textarea{width:100%;padding:13px;border:1px solid #e2e6ed;border-radius:12px;background:white}.sheet textarea{resize:vertical;min-height:110px}.submit{width:100%;margin-top:18px;background:var(--blue);border:0;color:white;border-radius:13px;padding:15px;font-weight:800}.preview{width:100%;max-height:200px;object-fit:contain;border-radius:12px;margin-top:10px;display:none}.detail-desc{white-space:pre-wrap;line-height:1.7;font-size:14px}.detail-img{width:100%;max-height:400px;object-fit:cover;border-radius:14px}.muted{font-size:12px;color:var(--muted)}@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}} 
</style></head><body>
<div class="wrap"><header class="head"><a class="brand" href="index.html">TE<span>UM</span></a><div class="head-actions"><button class="icon-btn" id="searchBtn" aria-label="검색">⌕</button><a class="icon-btn" href="index.html" aria-label="홈" style="display:grid;place-items:center">⌂</a></div></header>
<section class="intro"><small>TEUM FEED</small><h1>다른 사람들의 트임</h1><p>누군가는 오늘 무엇을 비웠을까요?<br>작은 변화부터 나만의 비움 이야기까지 모아봐요.</p></section>
<div class="tabs" id="tabs"><button class="active" data-tab="전체">추천</button><button data-tab="공간비움">공간비움</button><button data-tab="마음비움">마음비움</button><button data-tab="비움후기">비움후기</button></div>
<div class="section-title"><h2>어떤 공간을 비웠나요?</h2><small>원하는 주제로 골라보기</small></div><div class="chips" id="chips"></div>
<div class="toolbar"><input id="search" type="search" placeholder="비움 기록 검색" aria-label="게시글 검색"><select id="sort" aria-label="정렬"><option value="latest">최신순</option><option value="popular">인기순</option></select></div>
<div class="section-title"><h2 id="listTitle">모두의 비움 기록</h2><small id="count"></small></div><div class="grid" id="posts"></div>
<p class="hint">현재는 시범 운영 화면입니다. 작성한 기록은 이 브라우저에만 저장되며 다른 사람에게 공개되지 않습니다. 전체 사용자 공유 기능은 로그인·데이터베이스 연결 후 제공할 수 있습니다.</p></div>
<button class="fab" id="writeBtn">＋ 글쓰기</button>
<nav class="bottom" aria-label="하단 메뉴"><a href="index.html"><b>⌂</b>홈</a><a href="test.html"><b>✦</b>트임AI</a><a href="space-scan.html"><b>◎</b>트임AR</a><a class="active" href="community.html"><b>▦</b>트임피드</a><a href="challenge.html"><b>◯</b>내 기록</a></nav>
<div class="modal" id="writeModal"><div class="sheet"><div class="sheet-top"><h2>나의 트임 올리기</h2><button class="close" data-close>닫기 ×</button></div><form id="writeForm"><label class="field" for="nickname">닉네임</label><input id="nickname" maxlength="20" required placeholder="어떻게 불러드릴까요?"><label class="field" for="category">비움 종류</label><select id="category"><option>공간비움</option><option>마음비움</option><option>비움후기</option></select><label class="field" for="space">공간</label><select id="space"><option>기타</option><option>옷장</option><option>책상</option><option>주방</option><option>침실</option><option>거실</option><option>욕실</option></select><label class="field" for="postTitle">제목</label><input id="postTitle" maxlength="80" required placeholder="오늘 어떤 걸 비웠나요?"><label class="field" for="postBody">내용</label><textarea id="postBody" maxlength="2000" required placeholder="비우기 전과 후, 달라진 점을 남겨주세요."></textarea><label class="field" for="photo">사진 (선택)</label><input id="photo" type="file" accept="image/*"><img class="preview" id="preview" alt="사진 미리보기"><button class="submit" type="submit">내 브라우저에 기록 저장</button></form></div></div>
<div class="modal" id="detailModal"><div class="sheet"><div class="sheet-top"><h2 id="detailTitle"></h2><button class="close" data-close>닫기 ×</button></div><div id="detailContent"></div></div></div>
<script>
(()=>{'use strict';const KEY='teum-community-local-v1';const $=id=>document.getElementById(id);let records=[];try{const saved=JSON.parse(localStorage.getItem(KEY)||'[]');if(Array.isArray(saved))records=saved}catch(e){}let tab='전체',space='전체',query='';const spaces=['전체','옷장','책상','주방','침실','거실','욕실','기타'];const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const chips=$('chips');function drawChips(){chips.innerHTML=spaces.map(s=>'<button class="chip '+(s===space?'active':'')+'" data-space="'+s+'">'+s+'</button>').join('')}function filtered(){let a=records.filter(p=>(tab==='전체'||p.category===tab)&&(space==='전체'||p.space===space)&&(!query||[p.title,p.body,p.nickname,p.space].join(' ').toLowerCase().includes(query)));return a.sort((a,b)=>$('sort').value==='popular'?(b.likes||0)-(a.likes||0):b.id-a.id)}function render(){drawChips();const list=filtered();$('count').textContent=list.length+'개의 기록';$('listTitle').textContent=tab==='전체'?'모두의 비움 기록':tab;$('posts').innerHTML=list.length?list.map(p=>'<article class="post" data-id="'+p.id+'" tabindex="0" role="button" aria-label="'+esc(p.title)+'"><div class="cover">'+(p.image?'<img src="'+p.image+'" alt="게시글 사진">':'<span class="placeholder">✨</span>')+'<span class="pill">'+esc(p.space)+'</span></div><h3>'+esc(p.title)+'</h3><div class="meta"><span>'+esc(p.nickname)+'</span><span>♡ '+(p.likes||0)+'</span></div></article>').join(''):'<div class="empty"><strong>아직 등록된 기록이 없어요</strong>첫 번째 비움 이야기를 남겨보세요.<br>필터를 바꾸면 다른 기록도 확인할 수 있어요.</div>'}chips.addEventListener('click',e=>{const b=e.target.closest('[data-space]');if(b){space=b.dataset.space;render()}});$('tabs').addEventListener('click',e=>{const b=e.target.closest('[data-tab]');if(!b)return;tab=b.dataset.tab;document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x===b));render()});$('search').addEventListener('input',e=>{query=e.target.value.trim().toLowerCase();render()});$('searchBtn').onclick=()=>$('search').focus();$('sort').onchange=render;function open(id){$(id).classList.add('open')}function close(){document.querySelectorAll('.modal').forEach(m=>m.classList.remove('open'))}document.querySelectorAll('[data-close]').forEach(b=>b.onclick=close);document.querySelectorAll('.modal').forEach(m=>m.addEventListener('click',e=>{if(e.target===m)close()}));document.addEventListener('keydown',e=>{if(e.key==='Escape')close()});$('writeBtn').onclick=()=>open('writeModal');let photoData='';$('photo').onchange=e=>{photoData='';const file=e.target.files[0];if(!file)return;if(file.size>3*1024*1024){alert('사진은 3MB 이하로 올려주세요.');e.target.value='';return}const reader=new FileReader();reader.onload=()=>{photoData=String(reader.result);$('preview').src=photoData;$('preview').style.display='block'};reader.readAsDataURL(file)};$('writeForm').onsubmit=e=>{e.preventDefault();const p={id:Date.now(),nickname:$('nickname').value.trim(),category:$('category').value,space:$('space').value,title:$('postTitle').value.trim(),body:$('postBody').value.trim(),image:photoData,likes:0};if(!p.nickname||!p.title||!p.body)return;records.unshift(p);try{localStorage.setItem(KEY,JSON.stringify(records))}catch(err){alert('저장 공간이 부족합니다. 사진 크기를 줄여주세요.');records.shift();return}e.target.reset();photoData='';$('preview').style.display='none';tab='전체';space='전체';query='';$('search').value='';document.querySelectorAll('[data-tab]').forEach(x=>x.classList.toggle('active',x.dataset.tab==='전체'));close();render()};function showPost(id){const p=records.find(x=>x.id===id);if(!p)return;$('detailTitle').textContent=p.title;const c=$('detailContent');c.replaceChildren();if(p.image){const img=document.createElement('img');img.src=p.image;img.className='detail-img';img.alt='게시글 사진';c.appendChild(img)}const meta=document.createElement('p');meta.className='muted';meta.textContent=p.nickname+' · '+p.category+' · '+p.space;c.appendChild(meta);const body=document.createElement('p');body.className='detail-desc';body.textContent=p.body;c.appendChild(body);const del=document.createElement('button');del.className='submit';del.style.background='#f3f5f8';del.style.color='#555';del.textContent='내 기록 삭제';del.onclick=()=>{if(confirm('이 기록을 삭제할까요?')){records=records.filter(x=>x.id!==id);localStorage.setItem(KEY,JSON.stringify(records));close();render()}};c.appendChild(del);open('detailModal')}$('posts').addEventListener('click',e=>{const a=e.target.closest('[data-id]');if(a)showPost(Number(a.dataset.id))});$('posts').addEventListener('keydown',e=>{if(e.key==='Enter'){const a=e.target.closest('[data-id]');if(a)showPost(Number(a.dataset.id))}});render()})();
</script></body></html>
