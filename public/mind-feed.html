<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#ffffff"><title>마음비움 | 트임피드</title><style>
:root{--accent:#6477bb;--ink:#20252c;--muted:#79818b;--line:#e9edf2}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}a{text-decoration:none;color:inherit}button{font:inherit;cursor:pointer}.wrap{max-width:720px;margin:auto;padding:0 18px 110px}.top{height:65px;display:flex;align-items:center;justify-content:space-between}.brand{font-size:21px;font-weight:900;letter-spacing:-1px}.brand span{color:#2367e8}.top a:last-child{font-size:13px;color:#66717d}.eyebrow{font-size:11px;letter-spacing:.12em;color:var(--accent);font-weight:900;margin-top:18px}h1{font-size:30px;letter-spacing:-1.5px;margin:9px 0}.intro{color:var(--muted);font-size:13px;line-height:1.7;margin:0 0 21px}.tabs{display:flex;gap:23px;overflow-x:auto;scrollbar-width:none;border-bottom:1px solid var(--line)}.tabs a{flex:0 0 auto;padding:15px 0;font-size:14px;color:#8c939c;font-weight:700}.tabs a.active{border-bottom:3px solid var(--accent);color:var(--ink)}.hero{margin:23px 0 25px;background:#f0f0fb;padding:23px;border-radius:23px;min-height:170px;position:relative;overflow:hidden}.hero small{font-size:11px;font-weight:900;color:var(--accent)}.hero h2{font-size:23px;letter-spacing:-.9px;line-height:1.35;max-width:260px;margin:14px 0 8px}.hero p{font-size:12px;color:#697588;margin:0}.hero .art{position:absolute;right:20px;bottom:10px;font-size:78px;opacity:.75}.section{display:flex;align-items:center;justify-content:space-between;margin:23px 0 13px}.section h2{margin:0;font-size:18px;letter-spacing:-.6px}.section small{font-size:12px;color:var(--muted)}.chips{display:flex;gap:8px;overflow:auto;scrollbar-width:none;padding-bottom:8px}.chip{border:1px solid #e2e7ed;background:#fff;border-radius:99px;padding:9px 14px;white-space:nowrap;font-size:13px}.chip.active{background:#22262e;color:white;border-color:#22262e}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 12px;margin-top:16px}.card{min-width:0;cursor:pointer}.image{aspect-ratio:4/3;border-radius:17px;display:grid;place-items:center;background:#edf4ff;font-size:53px}.card:nth-child(3n+2) .image{background:#fff3dd}.card:nth-child(3n) .image{background:#f0f3ec}.card small{display:block;color:var(--accent);font-weight:800;font-size:11px;margin:10px 0 5px}.card h3{font-size:15px;letter-spacing:-.4px;line-height:1.45;margin:0 0 5px}.card p{font-size:12px;color:var(--muted);line-height:1.5;margin:0}.cta{margin-top:32px;background:#f5f8fd;padding:20px;border-radius:18px}.cta h3{font-size:16px;margin:0 0 7px}.cta p{font-size:12px;color:var(--muted);line-height:1.6}.cta a{display:inline-block;background:#2367e8;color:#fff;border-radius:12px;padding:11px 15px;font-size:13px;font-weight:800}.bottom{position:fixed;bottom:0;left:0;right:0;display:flex;justify-content:space-around;border-top:1px solid var(--line);background:#fff;padding:10px max(6px,calc((100vw - 720px)/2)) calc(9px + env(safe-area-inset-bottom));z-index:2}.bottom a{min-width:58px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#777}.bottom b{font-size:22px;font-weight:500}.bottom .active{color:#2367e8;font-weight:800}.overlay{position:fixed;inset:0;background:#101820a3;display:none;align-items:flex-end;justify-content:center;z-index:10}.overlay.open{display:flex}.sheet{background:#fff;width:min(100%,720px);border-radius:24px 24px 0 0;padding:22px 21px calc(26px + env(safe-area-inset-bottom));max-height:87vh;overflow:auto}.sheet button{float:right;border:0;background:#f2f4f6;border-radius:12px;padding:9px 13px}.sheet h2{clear:both;font-size:23px;letter-spacing:-.8px}.sheet p{font-size:14px;line-height:1.85;white-space:pre-line}.sheet small{color:var(--accent);font-weight:800}@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body>
<div class="wrap"><header class="top"><a class="brand" href="index.html">TE<span>UM</span></a><a href="community.html">트임피드 ↗</a></header><div class="eyebrow">TEUM MIND</div><h1>마음비움</h1><p class="intro">복잡한 생각과 감정을 잠깐 내려놓는 시간.<br>내 마음에 맞는 작은 비움부터 시작해요.</p><nav class="tabs"><a href="community.html">추천</a><a href="space-feed.html" class="">공간비움</a><a href="mind-feed.html" class="active">마음비움</a><a href="community.html?tab=비움후기">비움후기</a><a href="magazine.html">매거진</a></nav>
<section class="hero"><small>TODAY'S TEUM</small><h2>생각이 많을수록<br>작게 시작해요.</h2><p>나에게 필요한 마음의 여유 찾기</p><span class="art" aria-hidden="true">♡</span></section><div class="section"><h2>어떤 마음을 비우고 싶나요?</h2><small>주제별 골라보기</small></div><div class="chips" id="chips"></div><div class="section"><h2>마음 비움 이야기</h2><small id="count"></small></div><div class="grid" id="grid"></div><div class="cta"><h3>나도 비움 이야기를 남겨볼까요?</h3><p>나만의 변화와 작은 실천을 트임피드에 기록해보세요.</p><a href="community.html">트임피드로 이동 →</a></div></div>
<nav class="bottom"><a href="index.html"><b>⌂</b>홈</a><a href="test.html"><b>✦</b>트임AI</a><a href="action.html"><b>＋</b>비우기</a><a class="active" href="community.html"><b>▦</b>트임피드</a><a href="challenge.html"><b>◯</b>내 기록</a></nav><div class="overlay" id="overlay"><div class="sheet"><button id="close">닫기 ×</button><small id="detailCat"></small><h2 id="detailTitle"></h2><p id="detailBody"></p></div></div><script>
const data=[["생각정리","머릿속이 복잡한 날의 5분","생각을 적으면 우선순위가 보여요.","📝","종이나 메모 앱에 지금 신경 쓰이는 일을 모두 적어보세요.\\n\\n오늘 할 수 있는 일 하나에 표시하고 나머지는 내일 확인할 목록으로 옮겨보세요."],["스트레스","퇴근 후에도 일이 떠오른다면","오늘의 일을 마무리하는 작은 의식.","☕","오늘 끝낸 일 하나와 내일 할 일 하나를 적어보세요.\\n\\n내일 할 일을 기록했다면 잠시 업무 알림에서 벗어나 휴식 시간을 가져보세요."],["휴식","쉬어도 쉰 것 같지 않은 날","휴식에도 빈자리가 필요해요.","🌿","휴식 시간에 무언가를 더 해야 한다는 생각을 잠시 내려놓아보세요.\\n\\n10분 동안 알림을 끄고 물을 마시거나 창밖을 바라보는 것만으로도 휴식을 시작할 수 있습니다."],["관계","답장에 쫓기는 하루라면","내 속도로 소통하는 연습.","💬","모든 연락에 즉시 답해야 한다는 부담이 있다면, 급한 연락과 그렇지 않은 연락을 구분해보세요.\\n\\n필요할 때는 답장이 늦을 수 있다고 미리 알려두는 것도 방법입니다."],["감정","오늘 마음을 한 단어로 적기","감정을 판단하지 않고 바라보기.","☁️","지금 느끼는 감정을 한 단어로 적어보세요.\\n\\n왜 그런 감정을 느꼈는지 바로 결론을 내리지 않아도 괜찮습니다. 현재 상태를 알아차리는 것부터 시작해보세요."]],cats=["전체","생각정리","스트레스","휴식","관계","감정"];let selected="전체";const chips=document.getElementById("chips"),grid=document.getElementById("grid");function render(){chips.innerHTML=cats.map(c=>'<button class="chip '+(c===selected?'active':'')+'" data-cat="'+c+'">'+c+'</button>').join('');const list=data.filter(d=>selected==='전체'||d[0]===selected);document.getElementById('count').textContent=list.length+'개의 이야기';grid.innerHTML=list.map(d=>'<article class="card" tabindex="0" role="button" data-id="'+data.indexOf(d)+'"><div class="image">'+d[3]+'</div><small>'+d[0]+'</small><h3>'+d[1]+'</h3><p>'+d[2]+'</p></article>').join('')}chips.onclick=e=>{const b=e.target.closest('[data-cat]');if(b){selected=b.dataset.cat;render()}};function show(id){const d=data[id];if(!d)return;document.getElementById('detailCat').textContent=d[0];document.getElementById('detailTitle').textContent=d[1];document.getElementById('detailBody').textContent=d[4];document.getElementById('overlay').classList.add('open')}grid.onclick=e=>{const b=e.target.closest('[data-id]');if(b)show(Number(b.dataset.id))};grid.onkeydown=e=>{if(e.key==='Enter'){const b=e.target.closest('[data-id]');if(b)show(Number(b.dataset.id))}};document.getElementById('close').onclick=()=>document.getElementById('overlay').classList.remove('open');document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')e.target.classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('overlay').classList.remove('open')});render();
</script></body></html>
