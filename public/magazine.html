r-radius:16px;display:flex;align-items:center;justify-content:center;font-size:55px;background:#edf4fa}.article:nth-child(4n+2) .visual{background:#fff3db}.article:nth-child(4n+3) .visual{background:#ecf4e9}.article:nth-child(4n+4) .visual{background:#f6edf4}.article small{display:block;margin:11px 0 5px;color:var(--b);font-size:11px;font-weight:750}.article h3{font-size:15px;line-height:1.5;letter-spacing:-.5px;margin:0 0 7px}.article p{font-size:12px;line-height:1.55;color:var(--muted);margin:0}.empty{padding:36px;text-align:center;color:var(--muted);grid-column:1/-1}.back{display:inline-flex;align-items:center;gap:6px;margin:14px 0 0;font-size:13px;color:var(--b);font-weight:800}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px max(6px,calc((100vw - 720px)/2)) calc(9px + env(safe-area-inset-bottom));z-index:2}.bottom a{min-width:58px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#777}.bottom b{font-size:22px;font-weight:500}.bottom .active{color:var(--b);font-weight:800}.overlay{position:fixed;inset:0;background:#101820a3;display:none;align-items:flex-end;justify-content:center;z-index:10}.overlay.open{display:flex}.sheet{background:white;border-radius:24px 24px 0 0;width:min(100%,720px);padding:24px 22px calc(25px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.sheet button{float:right;border:0;border-radius:12px;background:#f2f4f6;padding:9px 14px;cursor:pointer}.sheet h2{font-size:24px;line-height:1.4;letter-spacing:-.8px;clear:both}.sheet p{font-size:14px;line-height:1.9;white-space:pre-line}.sheet .tag{font-size:12px;color:var(--b);font-weight:800}@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}.logo img{display:block;height:34px;width:auto;max-width:180px;object-fit:contain}</style><style>.visual img{width:100%;height:100%;object-fit:cover;border-radius:16px}.featured h2{white-space:pre-line}[hidden]{display:none!important}</style><style>.teum-instagram{margin:24px 0 28px;padding:20px;border:1px solid #e3eaf5;border-radius:20px;background:#f6f9ff;display:flex;align-items:center;justify-content:space-between;gap:14px}.teum-instagram strong{display:block;font-size:16px;color:#1e3154}.teum-instagram p{margin:6px 0 0;font-size:12px;line-height:1.6;color:#66768e}.teum-instagram a{flex-shrink:0;padding:12px 14px;border-radius:12px;background:#2367e8;color:#fff;font-size:12px;font-weight:800}@media(max-width:380px){.teum-instagram{align-items:stretch;flex-direction:column}.teum-instagram a{text-align:center}}</style><style>.mag-ig-grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin:14px 0 28px}.mag-ig-card{min-width:0;display:block}.mag-ig-card img{width:100%;aspect-ratio:4/5;object-fit:cover;border-radius:14px;background:#f2f4f6}.mag-ig-card p{font-size:12px;line-height:1.5;margin:6px 0;color:#424951;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}.mag-ig-empty{grid-column:1/-1;padding:18px;background:#f6f9ff;border-radius:14px;color:#66768e;font-size:13px}@media(min-width:600px){.mag-ig-grid{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body><div class="wrap"><header class="top"><a class="logo" href="index.html" aria-label="트임 홈"><img src="/tuim_logo.png" alt="TEUM" /></a><a href="community.html">트임피드 ↗</a></header><div class="eyebrow">TEUM MAGAZINE</div><h1 class="title">트임 매거진</h1><p class="desc">복잡한 일상에 작은 틈을 만드는 이야기.<br>오늘 바로 써먹을 수 있는 정리와 비움의 방법을 모았어요.</p><div class="tabs" id="tabs"><button class="active" data-cat="전체">전체</button><button data-cat="공간">공간 정리</button><button data-cat="마음">마음 비움</button><button data-cat="생활">생활 습관</button><button data-cat="관계">관계</button></div><section class="teum-instagram" aria-label="트임 공식 인스타그램"><div><strong>트임의 새로운 이야기</strong><p>인스타그램 @t____euim에서 만나보세요.</p></div><a href="https://www.instagram.com/t____euim/" target="_blank" rel="noopener noreferrer" aria-label="트임 공식 인스타그램 열기">인스타그램 보기 ↗</a></section><section aria-label="트임 인스타그램 게시물"><div class="section"><h2>트임 인스타그램 최신 게시물</h2></div><div class="mag-ig-grid" id="magInstagramFeed"><p class="mag-ig-empty">게시물을 불러오는 중이에요.</p></div></section><div class="featured"><small>EDITOR'S PICK</small><div><h2>정리의 시작은<br>버리는 게 아니에요.</h2><p>오늘 나에게 필요한 공간부터 찾는 방법</p></div></div><div class="section"><h2>가볍게 읽는 트임</h2><small id="count"></small></div><div class="grid" id="articles"></div><a class="back" href="community.html">← 다른 사람들의 트임 보러 가기</a></div><div class="overlay" id="overlay"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="detailTitle"><button id="close">닫기 ×</button><div class="tag" id="detailCat"></div><h2 id="detailTitle"></h2><img id="detailImage" alt="" hidden style="width:100%;max-height:360px;object-fit:contain;border-radius:14px"><p id="detailBody"></p></div></div><script>(async function(){const root=document.getElementById('magInstagramFeed');if(!root)return;function status(msg){root.replaceChildren();const p=document.createElement('p');p.className='mag-ig-empty';p.textContent=msg;root.appendChild(p)}try{const res=await fetch('/data/instagram-feed.json',{cache:'no-store'});if(!res.ok)throw Error('HTTP '+res.status);const data=await res.json();const posts=Array.isArray(data.posts)?data.posts:[];if(!posts.length){status('인스타그램 게시물 동기화를 기다리고 있어요.');return}root.replaceChildren();let count=0;for(const post of posts.slice(0,12)){if(!/^https:\/\/www\.instagram\.com\//.test(post.permalink||'')||!/^https:\/\//.test(post.image||''))continue;const a=document.createElement('a');a.className='mag-ig-card';a.href=post.permalink;a.target='_blank';a.rel='noopener noreferrer';const img=document.createElement('img');img.src=post.image;img.loading='lazy';img.alt='트임 공식 인스타그램 게시물';a.appendChild(img);const p=document.createElement('p');p.textContent=post.caption||'트임 공식 인스타그램';a.appendChild(p);root.appendChild(a);count++}if(!count)status('표시할 수 있는 인스타그램 게시물이 없어요.')}catch(e){status('인스타그램 게시물을 불러오지 못했어요. 잠시 후 다시 확인해 주세요.')}})();</script><script src="/cms-magazine.js?v=1" defer></script><script src="teum-bottom-nav.js?v=1" defer></script>
