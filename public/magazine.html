<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#fff"><title>트임 매거진 | TEUM</title><style>
:root{--b:#2367e8;--ink:#20252c;--muted:#777f89;--line:#e9edf2}*{box-sizing:border-box}body{margin:0;background:#fff;color:var(--ink);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}a{text-decoration:none;color:inherit}button,input{font:inherit}.wrap{max-width:720px;margin:auto;padding:0 18px 105px}.top{height:66px;display:flex;align-items:center;justify-content:space-between}.logo{font-weight:900;font-size:21px;letter-spacing:-1px}.logo span{color:var(--b)}.top a:last-child{font-size:13px;color:#626c77}.eyebrow{font-size:11px;color:var(--b);font-weight:900;letter-spacing:.14em;margin-top:20px}.title{font-size:29px;letter-spacing:-1.5px;margin:9px 0}.desc{font-size:13px;line-height:1.65;color:var(--muted);margin:0 0 22px}.tabs{display:flex;gap:24px;overflow:auto;border-bottom:1px solid var(--line);scrollbar-width:none}.tabs button{white-space:nowrap;background:none;border:0;padding:14px 0;color:#8a9098;font-size:14px;font-weight:700;cursor:pointer}.tabs button.active{color:var(--ink);border-bottom:3px solid var(--b)}.featured{margin:23px 0 32px;background:#eef4ff;border-radius:22px;padding:26px 22px;min-height:210px;display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden}.featured:after{content:"✦";position:absolute;right:16px;bottom:-42px;font-size:180px;color:#d6e4ff;pointer-events:none}.featured small,.featured h2,.featured p{position:relative;z-index:1}.featured small{font-size:11px;font-weight:900;color:var(--b)}.featured h2{font-size:24px;letter-spacing:-1px;line-height:1.35;max-width:260px;margin:15px 0 9px}.featured p{font-size:12px;color:#61748c;margin:0}.section{display:flex;justify-content:space-between;align-items:center;margin:24px 0 15px}.section h2{font-size:19px;letter-spacing:-.7px;margin:0}.section small{color:var(--muted);font-size:12px}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:22px 13px}.article{cursor:pointer;min-width:0}.visual{height:auto;aspect-ratio:4/3;border-radius:16px;display:flex;align-items:center;justify-content:center;font-size:55px;background:#edf4fa}.article:nth-child(4n+2) .visual{background:#fff3db}.article:nth-child(4n+3) .visual{background:#ecf4e9}.article:nth-child(4n+4) .visual{background:#f6edf4}.article small{display:block;margin:11px 0 5px;color:var(--b);font-size:11px;font-weight:750}.article h3{font-size:15px;line-height:1.5;letter-spacing:-.5px;margin:0 0 7px}.article p{font-size:12px;line-height:1.55;color:var(--muted);margin:0}.empty{padding:36px;text-align:center;color:var(--muted);grid-column:1/-1}.back{display:inline-flex;align-items:center;gap:6px;margin:14px 0 0;font-size:13px;color:var(--b);font-weight:800}.bottom{position:fixed;bottom:0;left:0;right:0;background:#fff;border-top:1px solid var(--line);display:flex;justify-content:space-around;padding:10px max(6px,calc((100vw - 720px)/2)) calc(9px + env(safe-area-inset-bottom));z-index:2}.bottom a{min-width:58px;display:flex;flex-direction:column;align-items:center;gap:4px;font-size:10px;color:#777}.bottom b{font-size:22px;font-weight:500}.bottom .active{color:var(--b);font-weight:800}.overlay{position:fixed;inset:0;background:#101820a3;display:none;align-items:flex-end;justify-content:center;z-index:10}.overlay.open{display:flex}.sheet{background:white;border-radius:24px 24px 0 0;width:min(100%,720px);padding:24px 22px calc(25px + env(safe-area-inset-bottom));max-height:88vh;overflow:auto}.sheet button{float:right;border:0;border-radius:12px;background:#f2f4f6;padding:9px 14px;cursor:pointer}.sheet h2{font-size:24px;line-height:1.4;letter-spacing:-.8px;clear:both}.sheet p{font-size:14px;line-height:1.9;white-space:pre-line}.sheet .tag{font-size:12px;color:var(--b);font-weight:800}@media(min-width:600px){.grid{grid-template-columns:repeat(3,minmax(0,1fr))}}</style></head><body><div class="wrap"><header class="top"><a class="logo" href="index.html">TE<span>UM</span></a><a href="community.html">트임피드 ↗</a></header><div class="eyebrow">TEUM MAGAZINE</div><h1 class="title">트임 매거진</h1><p class="desc">복잡한 일상에 작은 틈을 만드는 이야기.<br>오늘 바로 써먹을 수 있는 정리와 비움의 방법을 모았어요.</p><div class="tabs" id="tabs"><button class="active" data-cat="전체">전체</button><button data-cat="공간">공간 정리</button><button data-cat="마음">마음 비움</button><button data-cat="생활">생활 습관</button></div><div class="featured"><small>EDITOR'S PICK</small><div><h2>정리의 시작은<br>버리는 게 아니에요.</h2><p>오늘 나에게 필요한 공간부터 찾는 방법</p></div></div><div class="section"><h2>가볍게 읽는 트임</h2><small id="count"></small></div><div class="grid" id="articles"></div><a class="back" href="community.html">← 다른 사람들의 트임 보러 가기</a></div><nav class="bottom"><a href="index.html"><b>⌂</b>홈</a><a href="test.html"><b>✦</b>트임AI</a><a href="action.html"><b>＋</b>비우기</a><a class="active" href="community.html"><b>▦</b>트임피드</a><a href="challenge.html"><b>◯</b>내 기록</a></nav><div class="overlay" id="overlay"><div class="sheet"><button id="close">닫기 ×</button><div class="tag" id="detailCat"></div><h2 id="detailTitle"></h2><p id="detailBody"></p></div></div><script>
const articles=[
{cat:"공간",icon:"🧺",title:"10분 정리, 어디부터 시작할까?",sub:"가장 먼저 눈에 보이는 한 곳부터",body:"정리할 곳이 너무 많으면 시작하기가 어렵습니다. 오늘은 집 전체 대신 책상 한쪽이나 식탁 위처럼 작은 구역 하나를 정해보세요.\n\n1. 지금 보이는 물건을 한곳에 모아요.\n2. 자주 쓰는 것과 그렇지 않은 것을 구분해요.\n3. 남길 물건의 자리를 정해요.\n\n10분만 실행해도 다음에 정리할 곳이 보이기 시작합니다."},
{cat:"생활",icon:"👕",title:"옷장 정리할 때 먼저 볼 세 가지",sub:"계절보다 중요한 건 실제 사용 빈도",body:"옷장 앞에서 고민된다면 다음 세 가지를 확인해보세요.\n\n최근 1년 동안 입었는지, 지금 내 생활에 맞는지, 비슷한 옷이 여러 벌 있는지.\n\n당장 버릴지 결정하기 어렵다면 보류 상자를 하나 만들고 날짜를 적어두세요. 필요한 옷을 다시 꺼내 쓰는지 확인한 뒤 결정해도 늦지 않습니다."},
{cat:"마음",icon:"☁️",title:"머릿속이 복잡할 때 5분 비움",sub:"생각을 줄이기보다 밖으로 꺼내기",body:"해야 할 일이 떠오를 때마다 머릿속으로만 정리하면 더 피곤해질 수 있어요.\n\n종이나 메모 앱에 지금 신경 쓰이는 일을 모두 적어보세요. 그중 오늘 해결할 수 있는 한 가지만 동그라미 치고 나머지는 잠시 내려놓습니다.\n\n마음 비움은 모든 고민을 없애는 일이 아니라, 지금 집중할 한 가지를 정하는 일일 수 있습니다."},
{cat:"공간",icon:"📚",title:"책상 위에 남길 물건의 기준",sub:"매일 쓰는 물건만 손이 닿는 곳에",body:"책상에는 오늘 필요한 것만 남겨보세요.\n\n매일 사용하는 물건은 손이 닿는 곳에, 가끔 쓰는 물건은 서랍에, 오래 보관할 물건은 별도 보관함에 두는 식으로 나누면 관리하기 쉬워집니다.\n\n중요한 건 예쁘게 보이는 책상보다 다시 어지르기 어려운 배치입니다."},
{cat:"관계",icon:"💬",title:"답장에 쫓기지 않는 작은 습관",sub:"연락의 속도와 관계의 깊이는 달라요",body:"모든 메시지에 즉시 답해야 한다는 부담이 있다면, 연락을 확인하는 시간을 나눠보세요.\n\n급한 연락을 제외하고는 집중이 끝난 뒤 답해도 괜찮습니다. 상대방에게 답장이 늦을 수 있음을 미리 알려두면 오해를 줄이는 데 도움이 됩니다.\n\n관계를 소중히 여기는 일과 늘 연결되어 있는 일은 같지 않습니다."},
{cat:"생활",icon:"🫧",title:"정리가 유지되는 하루 3분",sub:"한 번에 완벽하게보다 조금씩 반복",body:"잠들기 전 3분만 집 안을 둘러보세요.\n\n제자리를 벗어난 물건 세 개를 돌려놓고, 내일 사용할 물건 한 개를 미리 꺼내두세요.\n\n정리를 오래 유지하는 방법은 큰 결심보다 부담 없는 반복에 가깝습니다."}
];let current='전체';const grid=document.getElementById('articles');const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const list=articles.filter(x=>current==='전체'||x.cat===current);document.getElementById('count').textContent=list.length+'개의 이야기';grid.innerHTML=list.map(x=>'<article class="article" tabindex="0" role="button" data-id="'+articles.indexOf(x)+'"><div class="visual" aria-hidden="true">'+x.icon+'</div><small>'+esc(x.cat)+' 비움</small><h3>'+esc(x.title)+'</h3><p>'+esc(x.sub)+'</p></article>').join('')||'<div class="empty">아직 등록된 이야기가 없습니다.</div>'}document.getElementById('tabs').onclick=e=>{const b=e.target.closest('[data-cat]');if(!b)return;current=b.dataset.cat;document.querySelectorAll('[data-cat]').forEach(t=>t.classList.toggle('active',t===b));render()};function openPost(id){const a=articles[id];if(!a)return;document.getElementById('detailCat').textContent=a.cat+' 비움';document.getElementById('detailTitle').textContent=a.title;document.getElementById('detailBody').textContent=a.body;document.getElementById('overlay').classList.add('open')}grid.onclick=e=>{const a=e.target.closest('[data-id]');if(a)openPost(Number(a.dataset.id))};grid.onkeydown=e=>{if(e.key==='Enter'){const a=e.target.closest('[data-id]');if(a)openPost(Number(a.dataset.id))}};document.getElementById('close').onclick=()=>document.getElementById('overlay').classList.remove('open');document.getElementById('overlay').onclick=e=>{if(e.target.id==='overlay')e.target.classList.remove('open')};document.addEventListener('keydown',e=>{if(e.key==='Escape')document.getElementById('overlay').classList.remove('open')});render();
</script></body></html>
