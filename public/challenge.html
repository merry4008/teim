<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#ffffff" />
  <title>트임 | 정리 챌린지</title>
  <link rel="stylesheet" href="styles.css?v=teum-action-1" />
  <style>
    .challenge-screen{padding-top:20px}.challenge-hero{background:#2563EB;color:#fff;border-radius:34px;padding:26px 22px;box-shadow:0 18px 44px rgba(37,99,235,.22)}.challenge-hero .small-label{color:#FFC928}.challenge-hero h1{margin:0;font-size:36px;line-height:1.08;letter-spacing:-.075em;color:#fff}.challenge-hero p{margin:12px 0 0;color:rgba(255,255,255,.86);font-size:15px}.challenge-progress{margin-top:14px;background:#fff;border:1px solid rgba(37,99,235,.14);border-radius:28px;padding:18px;box-shadow:0 14px 34px rgba(37,99,235,.08)}.challenge-progress b{display:block;color:#183B6B;font-size:21px;letter-spacing:-.05em}.challenge-progress p{margin:5px 0 12px;color:#64748b;font-size:13px}.challenge-track{height:10px;border-radius:999px;background:#eaf1ff;overflow:hidden}.challenge-fill{height:100%;width:0;background:linear-gradient(90deg,#2563EB,#FFC928);border-radius:999px;transition:.2s}.challenge-calendar{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;margin-top:14px}.day-cell{background:#fff;border:1px solid rgba(37,99,235,.14);border-radius:20px;padding:10px 7px;min-height:112px;box-shadow:0 12px 28px rgba(37,99,235,.07);display:flex;flex-direction:column;align-items:center;justify-content:space-between;text-align:center}.day-cell.done{border-color:#2563EB;background:#f8fbff}.day-num{display:inline-flex;align-items:center;justify-content:center;width:32px;height:32px;border-radius:50%;background:#EEF4FF;color:#2563EB;font-weight:1000;font-size:12px}.day-cell.done .day-num{background:#2563EB;color:#fff}.day-check{width:26px;height:26px;border-radius:50%;border:2px solid #dbe7ff;display:flex;align-items:center;justify-content:center;color:#fff;font-weight:1000;font-size:14px}.day-cell.done .day-check{background:#FFC928;border-color:#FFC928;color:#183B6B}.photo-preview{display:none;width:100%;aspect-ratio:1/1;border-radius:13px;object-fit:cover;background:#EEF4FF;margin:8px 0}.day-cell.has-photo .photo-preview{display:block}.photo-btn{width:100%;border:0;border-radius:14px;background:#FFC928;color:#183B6B;font-size:11px;font-weight:1000;padding:9px 4px;cursor:pointer}.photo-input{display:none}.reset-box{margin-top:14px;background:#fff;border:1px solid rgba(37,99,235,.12);border-radius:24px;padding:16px;text-align:center}.reset-box p{margin:0 0 10px;color:#64748b;font-size:13px}.reset-box button{border:0;border-radius:999px;background:#EEF4FF;color:#2563EB;font-weight:950;padding:11px 15px}@media(max-width:640px){.challenge-hero{border-radius:28px;padding:23px 20px}.challenge-hero h1{font-size:31px}.challenge-calendar{grid-template-columns:repeat(2,1fr);gap:9px}.day-cell{min-height:148px;border-radius:20px;padding:12px}.day-num{width:34px;height:34px}.photo-btn{font-size:12px;padding:10px 7px}}
  </style>
</head>
<body data-page="challenge">
  <header class="topbar"><a href="index.html" aria-label="트임 홈" style="display:flex;align-items:center"><img src="/tuim_logo.png" alt="TEUM" style="display:block;height:34px;width:auto" /></a><a class="top-action" href="index.html">홈</a></header>
  <main class="screen challenge-screen">
    <section class="challenge-hero"><p class="small-label">14 DAYS CHALLENGE</p><h1>14일 정리 챌린지</h1><p>달력에서 원하는 날짜를 선택하고, 사진을 올리면 체크가 완료됩니다. 인증 사진은 현재 기기 브라우저에만 저장됩니다.</p></section>
    <section class="challenge-progress"><b id="progressTitle">0 / 14 완료</b><p id="progressText">사진 인증을 올리면 해당 날짜가 체크됩니다.</p><div class="challenge-track"><div id="challengeFill" class="challenge-fill"></div></div></section>
    <section id="challengeCalendar" class="challenge-calendar" aria-label="14일 정리 챌린지 달력"></section>
    <section class="reset-box"><p>체크는 사진을 올린 날짜만 완료 처리됩니다.</p><button id="resetChallenge" type="button">챌린지 초기화</button></section>
  </main>
  <nav class="bottom-nav"><a data-nav="home" href="index.html">홈</a><a data-nav="test" href="test.html">마음비움</a><a data-nav="space" href="space.html">공간비움</a><a class="active" data-nav="challenge" href="challenge.html">챌린지</a><a data-nav="action" href="action.html">바로시작</a><a data-nav="program" href="program.html">문의</a></nav>
  <script>
    const key='teimChallenge14';
    const calendar=document.getElementById('challengeCalendar');
    const progressTitle=document.getElementById('progressTitle');
    const progressText=document.getElementById('progressText');
    const fill=document.getElementById('challengeFill');
    let data={};
    try{data=JSON.parse(localStorage.getItem(key)||'{}')}catch(e){data={}}
    function save(){localStorage.setItem(key,JSON.stringify(data))}
    function resizeImage(file,cb){const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const canvas=document.createElement('canvas');const size=640;const ratio=Math.min(size/img.width,size/img.height,1);canvas.width=Math.round(img.width*ratio);canvas.height=Math.round(img.height*ratio);const ctx=canvas.getContext('2d');ctx.drawImage(img,0,0,canvas.width,canvas.height);cb(canvas.toDataURL('image/jpeg',.78))};img.src=reader.result};reader.readAsDataURL(file)}
    function render(){calendar.innerHTML='';let done=0;Array.from({length:14}).forEach((_,i)=>{const day=i+1;const item=data[day];if(item&&item.photo)done++;const cell=document.createElement('article');cell.className='day-cell'+(item&&item.photo?' done has-photo':'');cell.innerHTML=`<span class="day-num">${day}일</span><img class="photo-preview" alt="${day}일차 인증 사진" src="${item&&item.photo?item.photo:''}"><span class="day-check">✓</span><label class="photo-btn">${item&&item.photo?'사진 변경':'사진 올리기'}<input class="photo-input" type="file" accept="image/*"></label>`;cell.querySelector('input').addEventListener('change',e=>{const file=e.target.files&&e.target.files[0];if(!file)return;resizeImage(file,photo=>{data[day]={photo,doneAt:new Date().toISOString()};save();render()})});calendar.appendChild(cell)});progressTitle.textContent=`${done} / 14 완료`;progressText.textContent=done===14?'14일 체크를 모두 완료했습니다.':done===0?'사진 인증을 올리면 해당 날짜가 체크됩니다.':`${14-done}일 남았습니다.`;fill.style.width=(done/14*100)+'%'}
    document.getElementById('resetChallenge').onclick=()=>{if(confirm('챌린지 인증 사진과 체크를 모두 초기화할까요?')){data={};save();render()}};
    render();
  </script>
</body>
</html>
