<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#f7f8fb"><title>트임 | AI 정리비서</title><style>
:root{--b:#2367e8;--n:#15264b;--y:#ffda52;--bg:#f7f8fb;--m:#748198;--l:#e7ebf2}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--n);font-family:system-ui,-apple-system,"Noto Sans KR",sans-serif}.bottom-nav{display:none!important}.app{width:min(620px,100%);min-height:100vh;margin:auto;background:#fff;display:flex;flex-direction:column}.top{height:68px;padding:0 18px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #f0f2f6;position:sticky;top:0;background:rgba(255,255,255,.94);backdrop-filter:blur(14px);z-index:5}.top a{text-decoration:none;color:var(--n);font-size:25px}.top b{font-size:16px}.online{font-size:11px;color:#36a36a;font-weight:800}.chat{padding:22px 18px 150px;display:flex;flex-direction:column;gap:16px}.row{display:flex;gap:10px;align-items:flex-end}.row.me{justify-content:flex-end}.face{width:38px;height:38px;border-radius:13px;background:var(--y);display:grid;place-items:center;font-weight:950;flex:none}.bubble{max-width:82%;padding:14px 16px;border-radius:20px 20px 20px 6px;background:#f2f5f9;font-size:14px;line-height:1.55}.me .bubble{background:var(--b);color:#fff;border-radius:20px 20px 6px 20px}.bubble small{display:block;color:var(--b);font-size:10px;font-weight:900;margin-bottom:4px}.choices{display:flex;flex-wrap:wrap;gap:8px;margin-left:48px}.choices button{border:1px solid var(--l);background:#fff;border-radius:999px;padding:11px 14px;font-weight:750;color:var(--n)}.choices button:active{background:#edf4ff;border-color:var(--b)}.typing{display:flex;gap:5px}.typing i{width:6px;height:6px;background:#9ba6b7;border-radius:50%}.result{position:relative;background:#fff;color:var(--n);border:1px solid #dfe7f4;border-radius:24px;padding:0;margin-left:48px;overflow:hidden;box-shadow:0 12px 34px rgba(35,103,232,.09)}.result-head{background:#eef4ff;padding:16px 18px 14px;border-bottom:1px solid #dce7fa}.result-head small{display:flex;align-items:center;gap:6px;color:var(--b);font-size:11px;font-weight:950;letter-spacing:.03em}.result-head small:before{content:"T";width:22px;height:22px;border-radius:8px;background:var(--y);color:var(--n);display:grid;place-items:center;font-size:11px}.result h2{font-size:23px;line-height:1.3;letter-spacing:-.045em;margin:8px 0 0;color:var(--n)}.result-body{padding:16px 18px 18px}.result-meta{display:flex;gap:6px;margin-bottom:12px}.result-meta span{background:#f5f7fb;border:1px solid var(--l);border-radius:999px;padding:6px 9px;color:#607087;font-size:10px;font-weight:800}.result p{color:#5e6d83;font-size:13px;line-height:1.65;margin:0}.result .why{margin-top:10px;padding-top:10px;border-top:1px solid #edf0f5;color:#7a8799}.result .actions{display:grid;grid-template-columns:1fr auto;gap:8px;margin-top:16px}.result a,.result button{border:0;text-decoration:none;text-align:center;padding:14px;border-radius:15px;font-weight:850;font-size:13px}.start{background:var(--b);color:#fff}.subbtn{background:#fff;color:var(--n);border:1px solid var(--l)!important}.result .actions .subbtn:last-child{min-width:108px}.result .actions a.subbtn{grid-column:1/-1;background:#f8f9fc}.composer{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:min(620px,100%);padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:linear-gradient(transparent,#fff 22%);display:flex;gap:8px}.composer input{flex:1;border:1px solid var(--l);background:#f7f8fb;border-radius:20px;padding:15px 17px;outline:0;font:inherit}.composer input:focus{border-color:var(--b)}.composer button{width:50px;border:0;border-radius:18px;background:var(--b);color:#fff;font-size:20px}.hint{font-size:11px;color:var(--m);margin-left:48px}.hidden{display:none}
</style></head><body data-teum-shell="ai"><main class="app"><header class="top"><a href="index.html">‹</a><b>트임 AI 정리비서</b><span class="online">● 대화 중</span></header><section class="chat" id="chat"></section><form class="composer" id="composer"><input id="input" autocomplete="off" placeholder="직접 말해도 괜찮아요"><button aria-label="보내기">↑</button></form></main><script>
const chat=document.getElementById('chat'),form=document.getElementById('composer'),input=document.getElementById('input');
const state={answers:[],space:'',problem:'',item:'',reason:'',effort:'',mission:null};let stage=0;
const flows=[
 {q:'오늘은 뭐가 제일 신경 쓰여요?',c:['집이 전체적으로 어수선해요','특정 공간만 정리하고 싶어요','물건 하나 때문에 고민이에요','뭐부터 해야 할지 모르겠어요']},
 {q:'좋아요. 어디를 먼저 볼까요?',c:['옷장','책상','주방','침실','거실','욕실','현관','직접 말할게요']},
 {q:'거기서 뭐가 제일 막막해요?',c:['물건이 너무 많아요','어디에 둬야 할지 모르겠어요','버릴지 말지 고민돼요','치워도 금방 다시 어질러져요','정리할 엄두가 안 나요']},
 {q:'조금만 더 볼게요. 특히 어떤 점이 그래요?',c:[]},
 {q:'오늘 어디까지 해볼까요?',c:['진짜 하나만','부담 없이 조금만','눈에 보이는 만큼','오늘은 제대로 해볼래요']}
];
function esc(s){return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]))}
function bot(text){chat.insertAdjacentHTML('beforeend','<div class="row"><div class="face">T</div><div class="bubble"><small>TEUM AI</small>'+esc(text)+'</div></div>')}
function me(text){chat.insertAdjacentHTML('beforeend','<div class="row me"><div class="bubble">'+esc(text)+'</div></div>')}
function choices(arr){if(!arr.length)return;const d=document.createElement('div');d.className='choices';arr.forEach(x=>{const b=document.createElement('button');b.type='button';b.textContent=x;b.onclick=()=>answer(x);d.appendChild(b)});chat.appendChild(d)}
function scroll(){setTimeout(()=>window.scrollTo({top:document.body.scrollHeight,behavior:'smooth'}),30)}
function dynamic(){const p=state.problem;if(p.includes('어디에'))return ['옷','서류·책','화장품','전자기기·선','생활용품','잡동사니'];if(p.includes('버릴'))return ['언젠가 쓸 것 같아요','아직 멀쩡해요','추억이 있어요','비싸게 샀어요','어떻게 버리는지 몰라요'];if(p.includes('금방'))return ['제자리가 없어요','꺼내기 불편해요','물건이 너무 많아요','가족이 같이 사용해요','나도 잘 모르겠어요'];if(p.includes('너무 많'))return ['종류가 너무 섞여 있어요','수납할 곳이 부족해요','안 쓰는 것도 많아요','어디부터 손댈지 모르겠어요'];return ['시작할 힘이 없어요','끝까지 못 할 것 같아요','생각만 해도 피곤해요','그냥 막막해요']}
function ask(){const f=flows[stage];bot(f.q);choices(stage===3?dynamic():f.c);scroll()}
function answer(v){document.querySelectorAll('.choices').forEach(x=>x.remove());me(v);state.answers.push(v);if(stage===1)state.space=v;if(stage===2)state.problem=v;if(stage===3)state.reason=v;if(stage===4)state.effort=v;stage++;if(stage<flows.length)setTimeout(ask,220);else setTimeout(recommend,300);scroll()}
const SPACE_RESULT_BANK={
'옷장':{targets:['상의','하의','양말','속옷','외투','가방','옷걸이','선반','서랍','계절옷'],actions:['제자리로 돌려놓기','같은 종류끼리 모으기','최근 안 입은 것 골라내기','한 칸만 비우기','겹쳐 있는 것 다시 접기','빈 옷걸이 모으기','자주 입는 것 앞으로 옮기기','세탁할 것 분리하기','중복된 것 확인하기','보관 위치 하나 정하기']},
'책상':{targets:['종이','펜','케이블','충전기','컵','영수증','책','노트','전자기기','서랍'],actions:['3개만 제자리로 보내기','같은 종류끼리 모으기','한 뼘만 비우기','안 쓰는 것 골라내기','선 하나 정리하기','서랍 한 칸만 정리하기','오늘 쓸 것만 남기기','종이 3장 분류하기','빈 공간 하나 만들기','자주 쓰는 위치 정하기']},
'주방':{targets:['싱크대','식탁','컵','접시','수저','조리도구','냉장고','양념','식재료','수납장'],actions:['보이는 것 3개 치우기','같은 종류끼리 모으기','유통기한 하나 확인하기','한 칸만 비우기','자주 쓰는 것 앞으로 옮기기','사용 후 자리 하나 정하기','빈 용기 골라내기','겹쳐 쌓인 것 정리하기','오늘 안 쓰는 것 넣기','조리 공간 한 뼘 만들기']},
'침실':{targets:['침대','협탁','옷','이불','베개','충전기','화장대','서랍','바닥','의자'],actions:['물건 3개 제자리로 보내기','표면 한 곳만 비우기','옷 한 벌 정리하기','침대 위 물건 내리기','서랍 한 칸만 정리하기','잠들기 전 쓸 것만 남기기','바닥 한 구역 비우기','같은 종류끼리 모으기','내일 쓸 것 하나만 꺼내두기','보이는 잡동사니 줄이기']},
'거실':{targets:['테이블','소파','리모컨','책','쿠션','가방','옷','장난감','선반','바닥'],actions:['물건 3개 제자리로 보내기','테이블 한 면 비우기','같은 종류끼리 모으기','소파 위 물건 내리기','자주 쓰는 자리 정하기','바닥 한 구역 비우기','흩어진 것 한 바구니에 모으기','선반 한 칸 정리하기','다른 방 물건 돌려보내기','눈에 띄는 것 하나 줄이기']},
'욕실':{targets:['세면대','화장품','수건','샴푸','세면도구','청소용품','서랍','선반','빈 용기','빨래'],actions:['빈 용기 하나 버리기','같은 종류끼리 모으기','세면대 위 3개 치우기','자주 쓰는 것만 남기기','수건 위치 정리하기','선반 한 칸 비우기','사용기한 하나 확인하기','청소용품 한곳에 모으기','젖은 것 분리하기','제자리 하나 정하기']},
'현관':{targets:['신발','우산','가방','택배상자','열쇠','마스크','외투','신발장','바닥','잡동사니'],actions:['신발 한 켤레 넣기','바닥 한 구역 비우기','외출용품 한곳에 모으기','택배상자 하나 처리하기','자주 신는 것 앞으로 옮기기','신발장 한 칸 정리하기','제자리 없는 것 하나 정하기','안 쓰는 것 골라내기','들어오자마자 둘 자리 만들기','흩어진 것 3개 치우기']}
};
function bankMission(space,mins){const b=SPACE_RESULT_BANK[space];if(!b)return null;const seed=(state.answers.join('|').length+Date.now())%100,ti=Math.floor(seed/10),ai=seed%10;return {title:b.targets[ti]+' '+b.actions[ai],action:space+' 전체를 정리하지 말고 '+b.targets[ti]+'부터 시작해보세요. 오늘은 이 한 가지를 끝내는 데 집중해요.',reason:'지금 선택한 '+space+'과 현재 상태를 기준으로 고른 작은 비움이에요.',duration:mins,category:space+' 비움'}}

function recommend(){bot('좋아요. 지금 상황에서 끝낼 수 있는 딱 하나를 골라볼게요.');const effort=state.effort||'부담 없이 조금만';const mins=effort.includes('하나')?3:effort.includes('제대로')?20:effort.includes('눈에')?10:5;state.mission=bankMission(state.space,mins)||{title:(state.space||'지금 공간')+'에서 제자리 없는 물건 3개만 고르기',action:'전체를 치우지 말고 눈에 먼저 들어오는 물건 3개만 골라 같은 종류끼리 모아주세요.',reason:'지금 막히는 이유를 먼저 줄이면 다음 행동을 정하기 쉬워져요.',duration:mins,category:'공간비움'};setTimeout(showResult,180)}
function showResult(){const m=state.mission;const d=document.createElement('div');d.className='result';d.innerHTML='<div class="result-head"><small>TEUM AI · 오늘의 1트</small><h2>'+esc(m.title)+'</h2></div><div class="result-body"><div class="result-meta"><span>'+esc(state.space||'지금 공간')+'</span><span>약 '+esc(m.duration||5)+'분</span></div><p>'+esc(m.action)+'</p><p class="why">'+esc(m.reason||'')+'</p><div class="actions"><a class="start" href="action.html">바로 시작하기 →</a><button class="subbtn" id="again">다른 추천</button>'+(state.problem.includes('어디에')?'<a class="subbtn" href="put-away.html">어디에 둘지 보기</a>':'')+(state.problem.includes('버릴')?'<a class="subbtn" href="discard.html">버리는 방법 보기</a>':'')+'</div></div>';chat.appendChild(d);document.getElementById('again').onclick=()=>{d.remove();state.mission=null;recommend()};scroll()}
form.onsubmit=e=>{e.preventDefault();const v=input.value.trim();if(!v)return;input.value='';answer(v)}
bot('안녕하세요 :) 저는 트임 AI 정리비서예요. 정답을 고르는 설문보다 지금 상황을 같이 좁혀볼게요.');setTimeout(ask,250);
</script></body></html>
